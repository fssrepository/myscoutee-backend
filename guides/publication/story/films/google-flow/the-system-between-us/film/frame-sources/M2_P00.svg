<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="720" height="1280" viewBox="0 0 720 1280">
  <defs>
    <linearGradient id="veil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071522" stop-opacity="0.92"/>
      <stop offset="0.42" stop-color="#153a46" stop-opacity="0.63"/>
      <stop offset="1" stop-color="#0b1127" stop-opacity="0.91"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dy="2" result="offset"/>
      <feFlood flood-color="#000000" flood-opacity="0.9" result="colour"/>
      <feComposite in="colour" in2="offset" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <image width="720" height="1280" preserveAspectRatio="xMidYMid slice"
         xlink:href="guides/publication/story/films/google-flow/the-system-between-us/assets/frames/M2_CP00.png"/>
  <rect width="720" height="1280" fill="url(#veil)"/>
  <g filter="url(#shadow)">
    <image x="144" y="28" width="88" height="88"
           xlink:href="frontend/src/assets/logo/heart.png"/>
    <text x="246" y="100" fill="#ffffff" font-family="DejaVu Sans, sans-serif"
          font-size="65" font-weight="700" letter-spacing="-1">yScoutee</text>
  </g>
  <g text-anchor="middle" font-family="DejaVu Sans, sans-serif" filter="url(#shadow)">
    <text x="360" y="172" fill="#ffc95a" font-size="49" font-weight="700" letter-spacing="3">THE STORY</text>
    <text x="360" y="224" fill="#ffffff" font-size="27" font-weight="700" letter-spacing="0.5">PART II · THE SYSTEM BETWEEN US</text>
    <text x="360" y="278" fill="#bfe4e9" font-size="28" font-weight="700" letter-spacing="1.7">BASED ON A TRUE STORY</text>
    <text x="360" y="1218" fill="#c2a5ff" stroke="#160d33" stroke-width="1.2"
          paint-order="stroke" font-size="35" font-weight="700" letter-spacing="1.2">BOOK AVAILABLE</text>
  </g>
</svg>
