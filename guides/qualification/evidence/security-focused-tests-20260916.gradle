gradle.projectsEvaluated {
    def p = gradle.rootProject.project(':projects:profile')
    p.sourceSets.test.java.setIncludes([
        '**/WebSecurityConfigBootstrapTest.java',
        '**/HomeUserProfileIdentityTest.java',
        '**/FirebaseFilterOperatorTest.java',
        '**/AccessControlServiceTest.java',
        '**/AccessPolicyTestSupport.java',
        '**/RequiresPolicyMethodInterceptorTest.java',
        '**/MediaSessionAccessServiceTest.java',
        '**/SessionMongoRoutingFilterTest.java'
    ] as Set)
    p.tasks.withType(Test).configureEach { maxHeapSize = '512m'; maxParallelForks = 1 }
}

gradle.projectsEvaluated {
    def p = gradle.rootProject.project(':projects:profile')
    p.tasks.register('securityRuntimeInventory') {
        doLast {
            def rows = p.configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.collect {
                [package: it.moduleVersion.id.group + ':' + it.name, version: it.moduleVersion.id.version]
            }.unique().sort { a, b -> a.package <=> b.package }
            new File('/tmp/myscoutee-runtime-coordinates-after.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(rows))
        }
    }
}
