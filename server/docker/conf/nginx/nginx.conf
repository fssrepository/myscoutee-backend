user  nginx;
worker_processes  auto;
worker_rlimit_nofile  16384;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
}


http {
    # One operator switch for automatic consent; manual opening remains available.
    map $host $myscoutee_consent_auto { default 0; }
    # Temporary landing diagnostics: change only default to 1, then nginx -t / reload.
    map $host $myscoutee_landing_debug { default 0; }
    # Only fixed numeric hints from the original HTML request enter SSI/diagnostics.
    map "$http_sec_purpose|$http_purpose|$http_x_purpose" $myscoutee_landing_purpose {
        default 0;
        ~*prerender 2;
        ~*(prefetch|preview) 1;
    }
    map $http_sec_fetch_user $myscoutee_landing_user { default 0; "?1" 1; }
    log_format landing_debug '$remote_addr - - [$time_local] "$request" '
                             '$status $body_bytes_sent "-" "$http_user_agent"';
    limit_req_zone $binary_remote_addr zone=mcp_registration:1m rate=6r/m;
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    gzip  on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        image/svg+xml
        text/css
        text/javascript
        text/plain;

    include /etc/nginx/conf.d/http-transport-policy.conf;
    include /etc/nginx/conf.d/spring.conf;
}

stream {
    include /etc/nginx/stream_conf.d/*.conf;
}
