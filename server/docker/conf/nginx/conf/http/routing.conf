    # Public browser surfaces for the internal demo payment provider. Keep its
    # private provider/control APIs on the Compose network.
    location ^~ /simulator-ui/ {
        proxy_pass http://payment-simulator:18082;

        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/(?:configuration-access|authorization-access|configuration-session|authorization-session|register|payment-method-registration-auth|public/payment-method-registrations|public/payment-authorizations|payment-wait|checkout|bank-auth|barion|test)(?:/|$) {
        proxy_pass http://payment-simulator:18082;

        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/activities/chats/ws {
        # Included from both the HTTP and HTTPS server blocks. The frontend picks
        # ws:// or wss:// from the current page protocol; nginx keeps the upgrade.
        proxy_pass http://profilemanagement:8080/activities/chats/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/admin/notifications/ws {
        # Included from both the HTTP and HTTPS server blocks. The frontend picks
        # ws:// or wss:// from the current page protocol; nginx keeps the upgrade.
        proxy_pass http://profilemanagement:8080/admin/notifications/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
