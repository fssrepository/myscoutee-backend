# Public availability only; no management details or credentials leave nginx.
location = /api/runtime-status {
    limit_except GET { deny all; }
    alias /tmp/myscoutee-status/status.json;
    default_type application/json;
    access_log off;
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/conf.d/https-response-policy.conf;
}
