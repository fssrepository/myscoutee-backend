spring:
  data:
    rest:
      detection-strategy: annotated
  profiles:
    active: ${SPRING_DEV:dev}
  main:
    allow-bean-definition-overriding: true

auth:
  # -1 disables the concurrent-session cap; positive values set the maximum.
  max-active-sessions: ${AUTH_MAX_ACTIVE_SESSIONS:-1}

integration:
  # Deployment configuration may override this fallback without a new build.
  public-base-url: ${INTEGRATION_PUBLIC_BASE_URL:http://localhost/api/integrations/v1}
  webhook:
    # Production remains HTTPS/public-only. Dev and E2E opt in explicitly.
    allow-http: ${INTEGRATION_WEBHOOK_ALLOW_HTTP:false}
    allow-private-addresses: ${INTEGRATION_WEBHOOK_ALLOW_PRIVATE_ADDRESSES:false}
    delivery-interval-ms: ${INTEGRATION_WEBHOOK_DELIVERY_INTERVAL_MS:1000}
    # Virtual threads, with a semaphore retaining the existing parallel-delivery ceiling.
    max-worker-count: ${INTEGRATION_WEBHOOK_MAX_WORKER_COUNT:100}
    delivery-batch-size: ${INTEGRATION_WEBHOOK_DELIVERY_BATCH_SIZE:100}

  events:
    # One process-wide token bucket covers callback verification and delivery; it never blocks a worker.
    requests-per-second: ${INTEGRATION_EVENTS_REQUESTS_PER_SECOND:4}
    burst: ${INTEGRATION_EVENTS_BURST:4}
    max-concurrent: ${INTEGRATION_EVENTS_MAX_CONCURRENT:8}

registry:
  enabled: ${REGISTRY_ENABLED:false}
  outbound-allowed: ${REGISTRY_OUTBOUND_ALLOWED:false}
  operator-registration-confirmed: ${REGISTRY_OPERATOR_REGISTRATION_CONFIRMED:false}
  base-url: ${REGISTRY_BASE_URL:}
  registry-scope: ${REGISTRY_SCOPE:}
  private-key-path: ${REGISTRY_PRIVATE_KEY_PATH:/etc/myscoutee/registry/deployment-private-key.pem}
  public-key-path: ${REGISTRY_PUBLIC_KEY_PATH:/etc/myscoutee/registry/deployment-public-key.der}
  state-dir: ${REGISTRY_STATE_DIR:/var/lib/myscoutee/registry}
  package-signing-public-key-path: ${OPERATOR_UPDATE_RELEASE_PUBLIC_KEY_PATH:/etc/myscoutee/update/release-public-key.pem}
  connect-timeout: ${REGISTRY_CONNECT_TIMEOUT:5s}
  request-timeout: ${REGISTRY_REQUEST_TIMEOUT:20s}
  retry-delay: ${REGISTRY_RETRY_DELAY:1m}
  max-response-bytes: ${REGISTRY_MAX_RESPONSE_BYTES:1048576}
  software-version: ${MYSCOUTEE_VERSION:unknown}
  expected-registry-key-fingerprint: ${REGISTRY_EXPECTED_KEY_FINGERPRINT:}
  trust-on-first-use: ${REGISTRY_TRUST_ON_FIRST_USE:false}
  allow-insecure-http: ${REGISTRY_ALLOW_INSECURE_HTTP:false}
  insecure-http-allowed-hosts: ${REGISTRY_INSECURE_HTTP_ALLOWED_HOSTS:}
  demo:
    base-url: ${REGISTRY_DEMO_BASE_URL:}
    registry-scope: ${REGISTRY_DEMO_SCOPE:}
    private-key-path: ${REGISTRY_DEMO_PRIVATE_KEY_PATH:/var/lib/myscoutee/registry-demo/keys/deployment-private-key.pem}
    public-key-path: ${REGISTRY_DEMO_PUBLIC_KEY_PATH:/var/lib/myscoutee/registry-demo/keys/deployment-public-key.der}
    state-dir: ${REGISTRY_DEMO_STATE_DIR:/var/lib/myscoutee/registry-demo/state}
    allow-insecure-http: ${REGISTRY_DEMO_ALLOW_INSECURE_HTTP:false}
    insecure-http-allowed-hosts: ${REGISTRY_DEMO_INSECURE_HTTP_ALLOWED_HOSTS:}

operator:
  configuration:
    master-key-path: ${OPERATOR_CONFIGURATION_MASTER_KEY_PATH:/etc/myscoutee/configuration/deployment-master-key}
  update:
    monitor-enabled: ${OPERATOR_UPDATE_MONITOR_ENABLED:false}
    tls-ca-certificate: ${OPERATOR_UPDATE_TLS_CA_CERTIFICATE:}
    release-api-origin: ${OPERATOR_UPDATE_RELEASE_API_ORIGIN:https://api.github.com}
    release-download-origin: ${OPERATOR_UPDATE_RELEASE_DOWNLOAD_ORIGIN:https://github.com}
    github-repository: ${OPERATOR_UPDATE_GITHUB_REPOSITORY:fssrepository/myscoutee}
    include-prereleases: ${OPERATOR_UPDATE_INCLUDE_PRERELEASES:false}
    enabled: ${OPERATOR_UPDATE_ENABLED:false}
    state-dir: ${OPERATOR_UPDATE_STATE_DIR:/var/lib/myscoutee/update}
    release-public-key-path: ${OPERATOR_UPDATE_RELEASE_PUBLIC_KEY_PATH:/etc/myscoutee/update/release-public-key.pem}
    max-artifact-bytes: ${OPERATOR_UPDATE_MAX_ARTIFACT_BYTES:4294967296}
    staging-safety-reserve-bytes: ${OPERATOR_UPDATE_STAGING_SAFETY_RESERVE_BYTES:536870912}
    download-connect-timeout: ${OPERATOR_UPDATE_DOWNLOAD_CONNECT_TIMEOUT:10s}
    download-timeout: ${OPERATOR_UPDATE_DOWNLOAD_TIMEOUT:30m}

payment:
  exchange-rates:
    development-hosts: ${PAYMENT_EXCHANGE_RATE_DEVELOPMENT_HOSTS:}
  enablePay: ${PAYMENT_ENABLE_PAY:false}
  registration:
    ttl: ${PAYMENT_REGISTRATION_TTL:PT10M}
  simulator:
    enabled: ${PAYMENT_SIMULATOR_ENABLED:false}
    baseUrl: ${PAYMENT_SIMULATOR_BASE_URL:}
    apiKey: ${PAYMENT_SIMULATOR_API_KEY:}
    registrationCallbackUrl: ${PAYMENT_SIMULATOR_REGISTRATION_CALLBACK_URL:}
    applicationBaseUrl: ${PAYMENT_SIMULATOR_APPLICATION_BASE_URL:}
    barionMerchantAccount: ${PAYMENT_SIMULATOR_BARION_MERCHANT_ACCOUNT:}
    stripeWebhookSecret: ${PAYMENT_SIMULATOR_WEBHOOK_SECRET:}
  settlement:
    pollDelay: ${PAYMENT_SETTLEMENT_POLL_DELAY:PT1M}
  operations:
    pollDelay: ${PAYMENT_OPERATIONS_POLL_DELAY:PT5S}
  stripe:
    apiKey: ${PAYMENT_STRIPE_API_KEY:}
    apiBaseUrl: ${PAYMENT_STRIPE_API_BASE_URL:}
    testGatewayEnabled: ${PAYMENT_STRIPE_TEST_GATEWAY_ENABLED:false}
    webhookSecret: ${PAYMENT_STRIPE_WEBHOOK_SECRET:}
  barion:
    apiKey: ${PAYMENT_BARION_API_KEY:}
    apiBaseUrl: ${PAYMENT_BARION_API_BASE_URL:}
    testGatewayEnabled: ${PAYMENT_BARION_TEST_GATEWAY_ENABLED:false}

# Own Docker STUN endpoint; by default the browser uses its application's hostname.
config:
  chat-call-stun-urls: ${CHAT_CALL_STUN_URLS:}
  chat-call-stun-port: ${CHAT_CALL_STUN_PORT:3478}
  chat-call-stun-health-host: ${CHAT_CALL_STUN_HEALTH_HOST:stun}
  chat-call-stun-health-port: 3478
