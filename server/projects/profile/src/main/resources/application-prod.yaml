management:
  health:
    show-details: "never"
  endpoints:
    web:
      base-path: "/"
      exposure:
        include: "health,prometheus"
      path-mapping:
        health: "health"
        prometheus: "metrics"

config:
  adminUser: ${ADMIN_USER:myscoutee@gmail.com}
  firebase-enabled: ${FIREBASE_ENABLED:true}
  firebase-service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:/run/secrets/firebase-service-account.json}
  chat-only-mode: ${CHAT_ONLY_MODE:false}
  dev-user: ${DEV_USER:}
  websocket-allowed-origin-patterns: ${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:https://myscoutee.com,https://www.myscoutee.com}

assets:
  source-refresh:
    enabled: ${ASSET_SOURCE_REFRESH_ENABLED:false}
    timeout-ms: ${ASSET_SOURCE_REFRESH_TIMEOUT_MS:5000}
    allowed-hosts: ${ASSET_SOURCE_REFRESH_ALLOWED_HOSTS:}

auth:
  region-security:
    enabled: ${AUTH_REGION_SECURITY_ENABLED:false}

media:
  enabled: ${MEDIA_ENABLED:true}
  endpoint: ${MEDIA_OBJECT_STORE_ENDPOINT:http://minio:9000}
  region: ${MEDIA_OBJECT_STORE_REGION:eu-central-1}
  access-key: ${MEDIA_OBJECT_STORE_ACCESS_KEY:${MINIO_ROOT_USER:}}
  secret-key: ${MEDIA_OBJECT_STORE_SECRET_KEY:${MINIO_ROOT_PASSWORD:}}
  bucket: ${MEDIA_BUCKET:myscoutee-media}
  path-style-access: ${MEDIA_OBJECT_STORE_PATH_STYLE:true}

fcm:
  url: "https://fcm.googleapis.com/fcm/send"
  apiKey: ${FCM_API_KEY:}

email:
  enabled: ${EMAIL_ENABLED:false}
  provider: ${EMAIL_PROVIDER:noop}
  from-email: ${EMAIL_FROM_EMAIL:no-reply@myscoutee.local}
  from-name: ${EMAIL_FROM_NAME:MyScoutee}
  reply-to: ${EMAIL_REPLY_TO:support@myscoutee.local}
  base-url: ${EMAIL_BASE_URL:https://myscoutee.com}
  sendgrid:
    api-key: ${EMAIL_SENDGRID_API_KEY:}
    endpoint: ${EMAIL_SENDGRID_ENDPOINT:https://api.sendgrid.com/v3/mail/send}
  promotions:
    enabled: ${EMAIL_PROMOTIONS_ENABLED:true}
    scheduler-poll-delay-ms: ${EMAIL_PROMOTIONS_SCHEDULER_POLL_DELAY_MS:60000}
    planning-delay-ms: ${EMAIL_PROMOTIONS_PLANNING_DELAY_MS:3600000}
    delivery-delay-ms: ${EMAIL_PROMOTIONS_DELIVERY_DELAY_MS:60000}
    delivery-batch-size: ${EMAIL_PROMOTIONS_DELIVERY_BATCH_SIZE:25}

events:
  scheduler:
    poll-delay-ms: ${EVENTS_SCHEDULER_POLL_DELAY_MS:1800000}

scheduled-messages:
  task-poll-delay-ms: ${SCHEDULED_MESSAGES_TASK_POLL_DELAY_MS:1800000}

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    serialization:
      FAIL_ON_EMPTY_BEANS: false
  mongodb:
    host: ${MONGODB_HOST:mongodb}
    port: ${MONGODB_PORT:27017}
    username: ${MONGODB_USERNAME:${MONGO_APP_USERNAME:}}
    password: ${MONGODB_PASSWORD:${MONGO_APP_PASSWORD:}}
    database: ${MONGODB_DATABASE:myscoutee_db}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      repositories:
        enabled: false

logging:
  level:
    org.springframework.data.mongodb.core.MongoTemplate: WARN
    org.springframework.integration: WARN
