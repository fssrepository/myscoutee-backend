management:
  health:
    show-details: "always"
  endpoints:
    web:
      base-path: "/"
      exposure:
        include: "health,shutdown,prometheus"
      path-mapping:
        health: "health"
        shutdown: "shutdown"
        prometheus: "metrics"

config:
  adminUser: ${ADMIN_USER:myscoutee@gmail.com}
  operator-user: ${OPERATOR_USER:}
  firebase-enabled: ${FIREBASE_ENABLED:false}
  firebase-service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:./secrets/firebase-service-account.json}
  chat-only-mode: ${CHAT_ONLY_MODE:false}
  dev-user: ${DEV_USER:dev@myscoutee.local}
  facebook-app-secret: ${FACEBOOK_APP_SECRET:}
  websocket-allowed-origin-patterns: ${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:http://localhost,http://localhost:4200,https://localhost,https://localhost:4200}

auth:
  region-security:
    enabled: ${AUTH_REGION_SECURITY_ENABLED:false}

admin:
  stats:
    enabled: ${ADMIN_STATS_ENABLED:true}

affinity:
  recompute:
    enabled: ${AFFINITY_RECOMPUTE_ENABLED:true}
    change-stream-enabled: ${AFFINITY_RECOMPUTE_CHANGE_STREAM_ENABLED:false}
    change-stream-fallback-poll-enabled: ${AFFINITY_RECOMPUTE_CHANGE_STREAM_FALLBACK_POLL_ENABLED:true}
    change-stream-wakeup-coalesce: ${AFFINITY_RECOMPUTE_CHANGE_STREAM_WAKEUP_COALESCE:250ms}
    change-stream-reconnect-delay: ${AFFINITY_RECOMPUTE_CHANGE_STREAM_RECONNECT_DELAY:5s}

media:
  enabled: ${MEDIA_ENABLED:true}
  endpoint: ${MEDIA_OBJECT_STORE_ENDPOINT:http://localhost:9000}
  region: ${MEDIA_OBJECT_STORE_REGION:eu-central-1}
  access-key: ${MEDIA_OBJECT_STORE_ACCESS_KEY:${MINIO_ROOT_USER:minioadmin}}
  secret-key: ${MEDIA_OBJECT_STORE_SECRET_KEY:${MINIO_ROOT_PASSWORD:minioadmin}}
  bucket: ${MEDIA_BUCKET:myscoutee-media}
  path-style-access: ${MEDIA_OBJECT_STORE_PATH_STYLE:true}

fcm:
  url: "https://fcm.googleapis.com/fcm/send"
  apiKey: ${FCM_API_KEY:}

email:
  enabled: ${EMAIL_ENABLED:false}
  provider: ${EMAIL_PROVIDER:noop}
  from-email: ${EMAIL_FROM_EMAIL:no-reply@myscoutee.local}
  from-name: ${EMAIL_FROM_NAME:MyScoutee}
  reply-to: ${EMAIL_REPLY_TO:support@myscoutee.local}
  base-url: ${EMAIL_BASE_URL:http://localhost:4200}
  sendgrid:
    api-key: ${EMAIL_SENDGRID_API_KEY:}
    endpoint: ${EMAIL_SENDGRID_ENDPOINT:https://api.sendgrid.com/v3/mail/send}
  promotions:
    enabled: ${EMAIL_PROMOTIONS_ENABLED:true}
    scheduler-poll-delay-ms: ${EMAIL_PROMOTIONS_SCHEDULER_POLL_DELAY_MS:60000}
    planning-delay-ms: ${EMAIL_PROMOTIONS_PLANNING_DELAY_MS:3600000}
    delivery-delay-ms: ${EMAIL_PROMOTIONS_DELIVERY_DELAY_MS:60000}
    delivery-batch-size: ${EMAIL_PROMOTIONS_DELIVERY_BATCH_SIZE:25}

events:
  scheduler:
    check-delay-ms: ${EVENTS_SCHEDULER_CHECK_DELAY_MS:60000}
    poll-delay-ms: ${EVENTS_SCHEDULER_POLL_DELAY_MS:1800000}
  waitlist:
    inviter-enabled: ${EVENTS_WAITLIST_INVITER_ENABLED:true}
    inviter-check-delay-ms: ${EVENTS_WAITLIST_INVITER_CHECK_DELAY_MS:60000}

scheduled-messages:
  task-poll-delay-ms: ${SCHEDULED_MESSAGES_TASK_POLL_DELAY_MS:1800000}

spring:
  config:
    import: optional:file:./secrets/application-dev-secrets.yaml
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    serialization:
      FAIL_ON_EMPTY_BEANS: false
  mongodb:
    host: ${MONGODB_HOST:localhost}
    port: ${MONGODB_PORT:27017}
    username: ${MONGODB_USERNAME:${MONGO_APP_USERNAME:guest}}
    password: ${MONGODB_PASSWORD:${MONGO_APP_PASSWORD:guest}}
    database: ${MONGODB_DATABASE:demo_db}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      repositories:
        enabled: false

logging:
  level:
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
    org.springframework.integration: WARN
