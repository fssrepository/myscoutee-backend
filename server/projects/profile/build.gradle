plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.3'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
	id "org.sonarqube" version "4.2.1.3168"
}

group = 'com.raxim'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	sourceCompatibility = JavaVersion.toVersion(25)
	targetCompatibility = JavaVersion.toVersion(25)
}

repositories {
	mavenCentral()
}

jar {
    enabled = false
	bootJar.enabled = true
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
        resources {
            srcDirs = ['src/test/resources']
        }
    }
    e2eTest {
        java {
            srcDirs = ['src/e2eTest/java']
        }
        resources {
            srcDirs = ['src/e2eTest/resources']
        }
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    e2eTestImplementation.extendsFrom testImplementation
    e2eTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
	implementation 'com.google.firebase:firebase-admin:7.1.1'
	implementation 'org.apache.httpcomponents:httpasyncclient'
	implementation 'org.jsoup:jsoup:1.18.1'
	implementation 'software.amazon.awssdk:s3:2.32.20'
	implementation 'software.amazon.awssdk:url-connection-client:2.32.20'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	implementation ('com.querydsl:querydsl-mongodb') {
		exclude group: 'org.mongodb', module: 'mongo-java-driver'
	}
	
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.security:spring-security-data'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-rest'
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'com.stripe:stripe-java:24.0.0'

	implementation 'com.itextpdf:itextpdf:5.5.13.2'
	
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.integration:spring-integration-test'
	testImplementation 'de.flapdoodle.embed:de.flapdoodle.embed.mongo:4.7.0'
}

tasks.named('jacocoTestReport') {
	reports {
		xml.required = true
		xml.outputLocation = layout.buildDirectory.file("reports/jacoco.xml")
	}
	dependsOn test
}

tasks.named('test') {
	useJUnitPlatform()

	finalizedBy jacocoTestReport
}

tasks.register('e2eTest', Test) {
	description = 'Runs backend HTTP e2e tests. Disabled from check unless -PrunE2e=true is supplied.'
	group = 'verification'

	testClassesDirs = sourceSets.e2eTest.output.classesDirs
	classpath = sourceSets.e2eTest.runtimeClasspath
	shouldRunAfter test
	useJUnitPlatform {
		includeTags 'e2e'
	}
}

tasks.named('check') {
	if (project.hasProperty('runE2e')) {
		dependsOn tasks.named('e2eTest')
	}
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs += ['-parameters']
}

sonar {
    properties {
		property 'sonar.projectKey', 'fssrepository_myscoutee_AYnBBjoHSeqh8PdnQJtM'
		property 'sonar.projectName', 'myscoutee'
		property 'sonar.token', 'sqp_f93823b500ff50e1259d61e67f709d22446e3369'
        property 'sonar.host.url', 'http://localhost:9000'
		property 'sonar.coverage.jacoco.xmlReportPaths', "${project.buildDir}/reports/jacoco.xml"
    }
}

tasks.named('sonar').configure {
    dependsOn test
}
