plugins {
	id 'java'
	alias(libs.plugins.spring.boot)
	alias(libs.plugins.dependency.management)
	id 'jacoco'
	alias(libs.plugins.sonar)
}

group = 'com.raxim'
version = System.getenv('MYSCOUTEE_VERSION') ?: '1.5.0'

// JUnit compilation must never replace the classes used by the running dev app.
def junitTasks = ['test', 'standardTest', 'embeddedTest', 'integrationTest',
                  'qualificationTest', 'testClasses', 'compileTestJava', 'processTestResources',
                  'e2eTest', 'e2eTestClasses', 'compileE2eTestJava', 'processE2eTestResources',
                  'jacocoTestReport', 'check', 'sonar']
def isolatedJunitBuild = providers.gradleProperty('isolatedJUnit')
    .map { it.toBoolean() }
    .orElse(gradle.startParameter.taskNames.any { junitTasks.contains(it.tokenize(':').last()) })
if (isolatedJunitBuild.get()) {
    layout.buildDirectory = layout.projectDirectory.dir('build/junit')
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(libs.versions.java.get().toInteger())
	}
	sourceCompatibility = JavaVersion.toVersion(libs.versions.java.get())
	targetCompatibility = JavaVersion.toVersion(libs.versions.java.get())
}

repositories {
	mavenCentral()
}

jar {
    enabled = false
	bootJar.enabled = true
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
        resources {
            srcDirs = ['src/test/resources']
        }
    }
    e2eTest {
        java {
            srcDirs = ['src/e2eTest/java']
        }
        resources {
            srcDirs = ['src/e2eTest/resources']
        }
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    e2eTestImplementation.extendsFrom testImplementation
    e2eTestRuntimeOnly.extendsFrom testRuntimeOnly
}

apply from: rootProject.file('gradle/dependency-policy.gradle')
apply from: rootProject.file('gradle/base-dependencies.gradle')

dependencies {
    implementation 'com.raxim.myscoutee.base:access-api'
    implementation 'com.raxim.myscoutee.base:accounts-api'
    implementation 'com.raxim.myscoutee.base:administration-api'
    implementation 'com.raxim.myscoutee.base:chat-api'
    implementation 'com.raxim.myscoutee.base:common-api'
    implementation 'com.raxim.myscoutee.base:email-api'
    implementation 'com.raxim.myscoutee.base:help-api'
    implementation 'com.raxim.myscoutee.base:integrations-api'
    implementation 'com.raxim.myscoutee.base:localization-api'
    implementation 'com.raxim.myscoutee.base:media-api'
    implementation 'com.raxim.myscoutee.base:notifications-api'
    implementation 'com.raxim.myscoutee.base:platform-api'
    implementation 'com.raxim.myscoutee.base:access'
    implementation 'com.raxim.myscoutee.base:accounts'
    implementation 'com.raxim.myscoutee.base:administration'
    implementation 'com.raxim.myscoutee.base:chat'
    implementation 'com.raxim.myscoutee.base:common-core'
    implementation 'com.raxim.myscoutee.base:common-mongo'
    implementation 'com.raxim.myscoutee.base:common-redis'
    implementation 'com.raxim.myscoutee.base:common-security'
    implementation 'com.raxim.myscoutee.base:common-session-web'
    implementation 'com.raxim.myscoutee.base:email'
    implementation 'com.raxim.myscoutee.base:help'
    implementation 'com.raxim.myscoutee.base:integrations'
    implementation 'com.raxim.myscoutee.base:localization'
    implementation 'com.raxim.myscoutee.base:media'
    implementation 'com.raxim.myscoutee.base:notifications'
    implementation 'com.raxim.myscoutee.base:platform-business'
	compileOnly libs.lombok
	annotationProcessor libs.lombok
	implementation libs.firebase
	implementation libs.bouncycastle
	implementation 'org.apache.httpcomponents:httpasyncclient'
	implementation 'org.apache.httpcomponents.client5:httpclient5'
	implementation libs.jsoup
	implementation libs.s3
	implementation libs.s3.http
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	implementation ('com.querydsl:querydsl-mongodb') {
		exclude group: 'org.mongodb', module: 'mongo-java-driver'
	}
	
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.security:spring-security-data'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-rest'
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation libs.stripe

	implementation libs.itext
	
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.integration:spring-integration-test'
	testImplementation libs.embedded.mongo
}

tasks.named('jacocoTestReport') {
	reports {
		xml.required = true
		xml.outputLocation = layout.buildDirectory.file("reports/jacoco.xml")
	}
	dependsOn test
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'qualification', 'integration'
	}

	finalizedBy jacocoTestReport
}

['standard', 'embedded'].each { level ->
    tasks.register("${level}Test", Test) {
        description = "Runs the ${level} JUnit group without external integration tests."
        group = 'verification'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        shouldRunAfter test
        useJUnitPlatform {
            includeTags level
            excludeTags 'qualification', 'integration'
        }
    }
}

tasks.register('integrationTest', Test) {
    description = 'Runs opt-in integration tests; excluded from the default unit suite.'
    group = 'verification'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter test
    useJUnitPlatform {
        includeTags 'integration'
        excludeTags 'qualification'
    }
}

tasks.register('qualificationTest', Test) {
	description = 'Runs opt-in Java-to-external-process qualification tests.'
	group = 'verification'

	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	shouldRunAfter test
	useJUnitPlatform {
		includeTags 'qualification'
	}
}

tasks.register('bootRunE2E', org.springframework.boot.gradle.tasks.run.BootRun) {
	description = 'Runs the profile app against disposable e2e_db for HTTP e2e flow tests.'
	group = 'application'

	mainClass = 'com.raxim.myscoutee.Main'
	classpath = sourceSets.main.runtimeClasspath

	def e2eDb = providers.environmentVariable('MONGO_E2E_DATABASE').orElse('e2e_db')
	environment 'SPRING_PROFILES_ACTIVE', providers.environmentVariable('SPRING_PROFILES_ACTIVE').orElse('dev').get()
	environment 'MONGODB_DATABASE', e2eDb.get()
	environment 'MONGODB_DEMO_DATABASE', e2eDb.get()
	environment 'FIREBASE_ENABLED', 'false'
	environment 'PAYMENT_ENABLE_PAY', providers.environmentVariable('PAYMENT_ENABLE_PAY').orElse('false').get()
	environment 'MEDIA_ENABLED', providers.environmentVariable('MEDIA_ENABLED').orElse('true').get()
	environment 'EVENTS_SCHEDULER_CHECK_DELAY_MS', providers.environmentVariable('EVENTS_SCHEDULER_CHECK_DELAY_MS').orElse('5000').get()
	environment 'E2E_MODE', 'true'
}

tasks.register('bootRunStress', org.springframework.boot.gradle.tasks.run.BootRun) {
	description = 'Runs the profile app in disposable e2e_db mode for external stress collections.'
	group = 'application'

	mainClass = 'com.raxim.myscoutee.Main'
	classpath = sourceSets.main.runtimeClasspath

	def e2eDb = providers.environmentVariable('MONGO_E2E_DATABASE').orElse('e2e_db')
	environment 'SPRING_PROFILES_ACTIVE', providers.environmentVariable('SPRING_PROFILES_ACTIVE').orElse('dev').get()
	environment 'MONGODB_DATABASE', e2eDb.get()
	environment 'MONGODB_DEMO_DATABASE', e2eDb.get()
	environment 'FIREBASE_ENABLED', 'false'
	environment 'PAYMENT_ENABLE_PAY', providers.environmentVariable('PAYMENT_ENABLE_PAY').orElse('false').get()
	environment 'MEDIA_ENABLED', providers.environmentVariable('MEDIA_ENABLED').orElse('true').get()
	environment 'EVENTS_SCHEDULER_CHECK_DELAY_MS', providers.environmentVariable('EVENTS_SCHEDULER_CHECK_DELAY_MS').orElse('5000').get()
	environment 'E2E_MODE', 'true'
	environment 'E2E_STRESS_MODE', 'true'
	jvmArgs '-Xms512m', '-Xmx2g'
}

tasks.register('e2eTest', Test) {
	description = 'Runs backend HTTP e2e tests. Disabled from check unless -PrunE2e=true is supplied.'
	group = 'verification'
	maxHeapSize = '2g'

	testClassesDirs = sourceSets.e2eTest.output.classesDirs
	classpath = sourceSets.e2eTest.runtimeClasspath
	shouldRunAfter test
	useJUnitPlatform {
		includeTags project.findProperty('e2eTestTag') ?: 'e2e'
	}
}

tasks.named('check') {
	if (project.hasProperty('runE2e')) {
		dependsOn tasks.named('e2eTest')
	}
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs += ['-parameters']
}

def profileHotReloadEnabled = providers.environmentVariable('PROFILEMANAGEMENT_HOT_RELOAD')
	.map { it.equalsIgnoreCase('true') && !isolatedJunitBuild.get() }
	.orElse(false)

tasks.named('bootRun') {
	def profileDebugPort = providers.environmentVariable('PROFILEMANAGEMENT_DEBUG_PORT').orNull
	if (profileDebugPort) {
		jvmArgs "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:${profileDebugPort}"
	}
	if (profileHotReloadEnabled.get()) {
		// The trigger must be configured on the application JVM itself. Passing
		// spring-boot.run.jvmArguments to Gradle does not reach BootRun.
		jvmArgs '-Dspring.devtools.restart.trigger-file=.reloadtrigger'
	}
}

tasks.register('touchDevtoolsReloadTrigger') {
	description = 'Signals Spring DevTools only after the existing profile classes build completed.'
	group = 'build setup'
	onlyIf { profileHotReloadEnabled.get() }
	doLast {
		def trigger = layout.buildDirectory.file('resources/main/.reloadtrigger').get().asFile
		trigger.parentFile.mkdirs()
		if (!trigger.exists()) {
			trigger.createNewFile()
		}
		trigger.setLastModified(System.currentTimeMillis())
	}
}

tasks.named('classes') {
	finalizedBy tasks.named('touchDevtoolsReloadTrigger')
}

sonar {
    properties {
		property 'sonar.projectKey', 'fssrepository_myscoutee_AYnBBjoHSeqh8PdnQJtM'
		property 'sonar.projectName', 'myscoutee'
		def sonarToken = providers.environmentVariable('SONAR_TOKEN').orNull
		if (sonarToken) {
			property 'sonar.token', sonarToken
		}
        property 'sonar.host.url', 'http://localhost:9000'
		property 'sonar.coverage.jacoco.xmlReportPaths', "${project.buildDir}/reports/jacoco.xml"
    }
}

tasks.named('sonar').configure {
    dependsOn test
}

// Distributed adapters remain outside the monolith's source/task graph.
sourceSets.main.java {
    exclude 'com/raxim/myscoutee/domain/*/transport/src/**'
    exclude 'com/raxim/myscoutee/common/microservices/**'
}
