#the purpose it that no external folder, everything is inside the image (angular js files, nginx configs etc.)
# that verion of image needs to be built -> it's handy as on production server i don't need to copy hunderds of files

networks:
  myscoutee:
    driver: bridge

services:
  # certbot:
  #   image: ${CERT_BOT}
  #   container_name: certbot
  #   hostname: certbot
  #   networks:
  #     - myscoutee
  #   environment:
  #     - RENEWAL_INTERVAL=12h
  #   entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep $${RENEWAL_INTERVAL} & wait $${!}; done;'"
  #   volumes:
  #    - ./data/certbot/conf:/etc/letsencrypt
  #    - ./data/certbot/www:/var/www/certbot
  #   depends_on:
  #     - nginx
  nginx:
    #build:
    #   context: docker/images/nginx
    container_name: nginx
    hostname: nginx
    image: ${NGINX_IMAGE}
    environment:
      TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
    #  WAIT_FOR: profilemanagement:8080
    ports:
      - 80:80
      - 443:443
      - 27017-27019:27017-27019
      - 5005:5005
    volumes:
      - ./docker/conf/nginx/conf/http:/etc/nginx/conf.d/
      - ./docker/conf/nginx/conf/stream:/etc/nginx/stream_conf.d/
      - ./docker/conf/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/conf/nginx/app/myscoutee:/usr/share/nginx/html
      - ./docker/conf/nginx/keys:/etc/nginx/keys
      #- ./docker/scripts:/scripts
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - myscoutee
    depends_on:
      - mongodb
      - redis
      - profilemanagement
      #- certbot
    #command: ["/scripts/wait-for-it.sh", "-t", "0", "profilemanagement:8080", "--", "nginx", "-g", "daemon off;"]
  mongodb:
    image: ${MONGO_IMAGE}
    container_name: mongodb
    hostname: mongodb
    #restart: always
    #entrypoint: [ "/usr/bin/mongod", "--bind_ip_all", "--replSet", "rs0" ]
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_REAL_DATABASE}
      MONGO_APP_DATABASE: ${MONGO_REAL_DATABASE}
      MONGO_SEED_DIRECTORY: myscoutee_db
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpw
      TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
    volumes:
      - ./docker/conf/mongodb/:/docker-entrypoint-initdb.d
      - ./data/mongodb/data:/data/db
      - ./docker/scripts:/scripts
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - myscoutee
    #ports:
    #  - 27017-27019:27017-27019
  redis:
    image: ${REDIS_IMAGE}
    container_name: redis
    hostname: redis
    environment:
      TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - myscoutee
  minio:
    image: ${MINIO_IMAGE}
    container_name: minio
    hostname: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
    volumes:
      - ./data/minio:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - myscoutee
  profilemanagement:
    image: ${MYSCOUTEE_IMAGE}
    build:
       context: projects/profile
       args:
         TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
    container_name: myscoutee
    hostname: myscoutee
    environment:
      MONGODB_HOST: "mongodb"
      MONGODB_DATABASE: "${MONGO_REAL_DATABASE}"
      MONGODB_USERNAME: "guest"
      MONGODB_PASSWORD: "guest"
      SPRING_DATA_REDIS_HOST: "redis"
      SPRING_DATA_REDIS_PORT: "6379"
      FIREBASE_ENABLED: "false"
      DEV_USER: "dev@myscoutee.local"
      ADMIN_USER: "myscoutee@gmail.com"
      MEDIA_ENABLED: "true"
      MEDIA_OBJECT_STORE_ENDPOINT: "http://minio:9000"
      MEDIA_OBJECT_STORE_REGION: "eu-central-1"
      MEDIA_OBJECT_STORE_ACCESS_KEY: "${MINIO_ROOT_USER}"
      MEDIA_OBJECT_STORE_SECRET_KEY: "${MINIO_ROOT_PASSWORD}"
      MEDIA_BUCKET: "${MEDIA_BUCKET}"
      MEDIA_OBJECT_STORE_PATH_STYLE: "true"
      ASSET_SOURCE_REFRESH_ENABLED: "${ASSET_SOURCE_REFRESH_ENABLED}"
      ASSET_SOURCE_REFRESH_ALLOWED_HOSTS: "${ASSET_SOURCE_REFRESH_ALLOWED_HOSTS}"
      TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
      JAVA_TOOL_OPTIONS: >
              -Xdebug
              -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    volumes:
      - ./data/profile/img:/tmp/img
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - myscoutee
    depends_on:
      - mongodb
      - redis
      - minio
