# Production stack.
# Build the frontend production bundle before building this stack. The nginx
# image bakes frontend/prod into /usr/share/nginx/html.

networks:
  myscoutee:
    driver: bridge

secrets:
  firebase-service-account:
    file: ./projects/profile/secrets/firebase-service-account.json

services:
  mcp:
    image: ${MCP_IMAGE:-myscoutee-mcp:1.3.0-prod}
    build:
      context: ../../myscoutee-mcp
      dockerfile: Dockerfile
    container_name: mcp
    hostname: mcp
    restart: unless-stopped
    environment:
      MYSCOUTEE_MCP_TRANSPORT: http
      MYSCOUTEE_MCP_LISTEN: 0.0.0.0:8080
      MYSCOUTEE_API_BASE_URL: http://profilemanagement:8080
      MYSCOUTEE_PUBLIC_API_BASE_URL: https://${DOMAIN:-localhost}/api
    networks:
      - myscoutee
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "/myscoutee-mcp", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s

  # certbot:
  #   image: ${CERT_BOT}
  #   container_name: certbot
  #   hostname: certbot
  #   networks:
  #     - myscoutee
  #   environment:
  #     - RENEWAL_INTERVAL=12h
  #   entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep $${RENEWAL_INTERVAL} & wait $${!}; done;'"
  #   volumes:
  #    - ./data/certbot/conf:/etc/letsencrypt
  #    - ./data/certbot/www:/var/www/certbot
  #   depends_on:
  #     - nginx
  nginx:
    container_name: nginx
    hostname: nginx
    image: ${NGINX_PRODUCTION_IMAGE:-myscoutee-nginx:1.3.0-prod}
    pull_policy: build
    restart: unless-stopped
    build:
      context: docker
      dockerfile: images/nginx/prod/Dockerfile
      additional_contexts:
        frontend-prod: ../frontend/prod
      args:
        NGINX_BASE_IMAGE: ${NGINX_BASE_IMAGE:-myscoutee-nginx:1.3.0-base}
        TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
    environment:
      TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
      LETSENCRYPT_ENABLED: ${LETSENCRYPT_ENABLED:-false}
      DOMAIN: ${DOMAIN:-localhost}
      NGINX_TLS_CERTIFICATE_PATH: ${NGINX_TLS_CERTIFICATE_PATH:-/etc/nginx/keys/nginx.crt}
      NGINX_TLS_CERTIFICATE_KEY_PATH: ${NGINX_TLS_CERTIFICATE_KEY_PATH:-/etc/nginx/keys/nginx-nopass.key}
    #  WAIT_FOR: profilemanagement:8080
    ports:
      - 80:80
      - 443:443
      - 127.0.0.1:27017:27017
    volumes:
      - ./docker/conf/nginx/keys:/etc/nginx/keys
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - myscoutee
    depends_on:
      - mcp
      - mongodb
      - redis
      - profilemanagement
      #- certbot
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      # Probe promptly during startup; keep the steady-state interval unchanged.
      start_interval: 2s
      start_period: 20s
  mongodb:
    image: ${MONGO_IMAGE}
    container_name: mongodb
    hostname: mongodb
    restart: unless-stopped
    env_file:
      - .env.secrets
    #restart: always
    #entrypoint: [ "/usr/bin/mongod", "--bind_ip_all", "--replSet", "rs0" ]
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_REAL_DATABASE}
      MONGO_APP_DATABASE: ${MONGO_REAL_DATABASE}
      MONGO_SEED_DIRECTORY: myscoutee_db
      MONGO_IMPORT_ALL_SEED_DATABASES: "true"
      MONGO_IMPORT_ALLOWED_COLLECTIONS_BY_DB: ${MONGO_IMPORT_ALLOWED_COLLECTIONS_BY_DB}
      TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
    volumes:
      - ./docker/conf/mongodb/:/docker-entrypoint-initdb.d
      - ./data/mongodb/data-v8-0:/data/db
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - myscoutee
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$${MONGO_APP_USERNAME:-guest}\" --password \"$${MONGO_APP_PASSWORD:-guest}\" --authenticationDatabase \"$${MONGO_APP_DATABASE:-myscoutee_db}\" \"$${MONGO_APP_DATABASE:-myscoutee_db}\" --eval 'db.runCommand({ ping: 1 }).ok' | grep -q 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Probe promptly during startup; keep the steady-state interval unchanged.
      start_interval: 2s
      start_period: 30s
    #ports:
    #  - 127.0.0.1:27017:27017
  redis:
    image: ${REDIS_IMAGE}
    container_name: redis
    hostname: redis
    restart: unless-stopped
    environment:
      TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - myscoutee
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 5
      # Probe promptly during startup; keep the steady-state interval unchanged.
      start_interval: 2s
      start_period: 10s
  minio:
    image: ${MINIO_PRODUCTION_IMAGE:-myscoutee-minio:1.3.0-prod}
    pull_policy: build
    build:
      context: .
      dockerfile: docker/images/minio/Dockerfile
      args:
        MINIO_BASE_IMAGE: ${MINIO_BASE_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    container_name: minio
    hostname: minio
    restart: unless-stopped
    env_file:
      - .env.secrets
    command: server /data --console-address ":9001"
    environment:
      MEDIA_BUCKET: "${MEDIA_BUCKET}"
      MINIO_ENDPOINT: "http://127.0.0.1:9000"
      TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
    volumes:
      - ./data/minio:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - myscoutee
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/myscoutee-minio-seeded && curl -fsS http://localhost:9000/minio/health/live >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      # Probe promptly during startup; keep the steady-state interval unchanged.
      start_interval: 2s
      start_period: 20s
  profilemanagement:
    image: ${MYSCOUTEE_PRODUCTION_IMAGE:-myscoutee-api:1.3.0-prod}
    pull_policy: build
    restart: unless-stopped
    build:
       # Deliberately expose only the compiled JAR to BuildKit. Runtime Mongo,
       # registry, key, and secret directories must never enter this context.
       context: projects/profile/build/libs
       dockerfile: ../../../../docker/images/profilemanagement/prod/Dockerfile
       args:
         TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
    container_name: myscoutee
    hostname: myscoutee
    env_file:
      # Includes the install-generated Operator bootstrap subject and digest.
      # Do not shadow either with empty environment interpolation below.
      - .env.secrets
    environment:
      SPRING_PROFILES_ACTIVE: "prod"
      MYSCOUTEE_VERSION: "${MYSCOUTEE_VERSION:-1.3.0}"
      MONGODB_HOST: "mongodb"
      MONGODB_DATABASE: "${MONGO_REAL_DATABASE}"
      MONGODB_DEMO_DATABASE: "${MONGO_DEMO_DATABASE}"
      SPRING_DATA_REDIS_HOST: "redis"
      SPRING_DATA_REDIS_PORT: "6379"
      FIREBASE_ENABLED: "${FIREBASE_ENABLED:-true}"
      AUTH_MAX_ACTIVE_SESSIONS: "${AUTH_MAX_ACTIVE_SESSIONS:--1}"
      INTEGRATION_PUBLIC_BASE_URL: "${INTEGRATION_PUBLIC_BASE_URL:-https://localhost/api/integrations/v1}"
      FACEBOOK_APP_SECRET: "${FACEBOOK_APP_SECRET:-}"
      MEMBER_USER: ""
      OPERATOR_USER: "${OPERATOR_USER:-}"
      OPERATOR_CONFIGURATION_MASTER_KEY_PATH: "/etc/myscoutee/configuration/deployment-master-key"
      WEBSOCKET_ALLOWED_ORIGIN_PATTERNS: "${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:-https://localhost,https://127.0.0.1,http://localhost:8080,http://127.0.0.1:8080}"
      EMAIL_BASE_URL: "${EMAIL_BASE_URL:-https://localhost}"
      MEDIA_ENABLED: "true"
      MEDIA_OBJECT_STORE_ENDPOINT: "http://minio:9000"
      MEDIA_OBJECT_STORE_REGION: "eu-central-1"
      MEDIA_BUCKET: "${MEDIA_BUCKET}"
      MEDIA_OBJECT_STORE_PATH_STYLE: "true"
      ASSET_SOURCE_REFRESH_ENABLED: "${ASSET_SOURCE_REFRESH_ENABLED}"
      ASSET_SOURCE_REFRESH_ALLOWED_HOSTS: "${ASSET_SOURCE_REFRESH_ALLOWED_HOSTS}"
      REGISTRY_ENABLED: "${REGISTRY_ENABLED:-false}"
      REGISTRY_OUTBOUND_ALLOWED: "${REGISTRY_OUTBOUND_ALLOWED:-false}"
      REGISTRY_OPERATOR_REGISTRATION_CONFIRMED: "${REGISTRY_OPERATOR_REGISTRATION_CONFIRMED:-false}"
      REGISTRY_BASE_URL: "${REGISTRY_BASE_URL:-}"
      REGISTRY_SCOPE: "${REGISTRY_SCOPE:-}"
      REGISTRY_PRIVATE_KEY_PATH: "${REGISTRY_PRIVATE_KEY_PATH:-/etc/myscoutee/registry/deployment-private-key.pem}"
      REGISTRY_PUBLIC_KEY_PATH: "${REGISTRY_PUBLIC_KEY_PATH:-/etc/myscoutee/registry/deployment-public-key.der}"
      REGISTRY_STATE_DIR: "${REGISTRY_STATE_DIR:-/var/lib/myscoutee/registry}"
      REGISTRY_CONNECT_TIMEOUT: "${REGISTRY_CONNECT_TIMEOUT:-5s}"
      REGISTRY_REQUEST_TIMEOUT: "${REGISTRY_REQUEST_TIMEOUT:-15s}"
      REGISTRY_RETRY_DELAY: "${REGISTRY_RETRY_DELAY:-15m}"
      REGISTRY_MAX_RESPONSE_BYTES: "${REGISTRY_MAX_RESPONSE_BYTES:-1048576}"
      REGISTRY_EXPECTED_KEY_FINGERPRINT: "${REGISTRY_EXPECTED_KEY_FINGERPRINT:-}"
      REGISTRY_TRUST_ON_FIRST_USE: "${REGISTRY_TRUST_ON_FIRST_USE:-false}"
      REGISTRY_ALLOW_INSECURE_HTTP: "${REGISTRY_ALLOW_INSECURE_HTTP:-false}"
      REGISTRY_INSECURE_HTTP_ALLOWED_HOSTS: "${REGISTRY_INSECURE_HTTP_ALLOWED_HOSTS:-}"
      REGISTRY_DEMO_BASE_URL: "http://registry:8080"
      REGISTRY_DEMO_SCOPE: "demo:myscoutee"
      REGISTRY_DEMO_PRIVATE_KEY_PATH: "/var/lib/myscoutee/registry-demo/keys/deployment-private-key.pem"
      REGISTRY_DEMO_PUBLIC_KEY_PATH: "/var/lib/myscoutee/registry-demo/keys/deployment-public-key.der"
      REGISTRY_DEMO_STATE_DIR: "/var/lib/myscoutee/registry-demo/state"
      REGISTRY_DEMO_ALLOW_INSECURE_HTTP: "true"
      REGISTRY_DEMO_INSECURE_HTTP_ALLOWED_HOSTS: "registry"
      PAYMENT_SIMULATOR_ENABLED: "true"
      PAYMENT_SIMULATOR_BASE_URL: "http://payment-simulator:18082"
      PAYMENT_SIMULATOR_REGISTRATION_CALLBACK_URL: "http://profilemanagement:8080/payment-methods/registrations/callback"
      PAYMENT_SIMULATOR_APPLICATION_BASE_URL: "${PAYMENT_SIMULATOR_APPLICATION_BASE_URL:-https://localhost}"
      PAYMENT_SIMULATOR_BARION_MERCHANT_ACCOUNT: "${PAYMENT_SIMULATOR_BARION_MERCHANT_ACCOUNT:-merchant@myscoutee.invalid}"
      PAYMENT_STRIPE_API_BASE_URL: "http://payment-simulator:18082"
      PAYMENT_STRIPE_TEST_GATEWAY_ENABLED: "true"
      PAYMENT_BARION_API_BASE_URL: "http://payment-simulator:18082"
      PAYMENT_BARION_TEST_GATEWAY_ENABLED: "true"
      OPERATOR_UPDATE_ENABLED: "${MYSCOUTEE_UPDATE_ENABLED:-false}"
      OPERATOR_UPDATE_STATE_DIR: "/var/lib/myscoutee/update"
      OPERATOR_UPDATE_RELEASE_PUBLIC_KEY_PATH: "/etc/myscoutee/update/release-public-key.pem"
      OPERATOR_UPDATE_MAX_ARTIFACT_BYTES: "${MYSCOUTEE_UPDATE_MAX_ARTIFACT_BYTES:-4294967296}"
      OPERATOR_UPDATE_STAGING_SAFETY_RESERVE_BYTES: "${MYSCOUTEE_UPDATE_STAGING_SAFETY_RESERVE_BYTES:-536870912}"
      TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
      JAVA_TOOL_OPTIONS: "--enable-native-access=ALL-UNNAMED -XX:+ExitOnOutOfMemoryError"
    secrets:
      - source: firebase-service-account
        target: firebase-service-account.json
    volumes:
      - "${OPERATOR_CONFIGURATION_KEY_DIR_HOST:-./data/configuration}:/etc/myscoutee/configuration:ro"
      - "${REGISTRY_KEY_DIR_HOST:-./data/registry-keys}:/etc/myscoutee/registry:rw"
      - "${REGISTRY_STATE_DIR_HOST:-./data/registry}:/var/lib/myscoutee/registry"
      - registry-demo-client-data:/var/lib/myscoutee/registry-demo
      - "${MYSCOUTEE_UPDATE_STATE_DIR_HOST:-./data/update}/inbox/staging:/var/lib/myscoutee/update/staging:rw"
      - "${MYSCOUTEE_UPDATE_STATE_DIR_HOST:-./data/update}/inbox/requests:/var/lib/myscoutee/update/requests:rw"
      - "${MYSCOUTEE_UPDATE_STATE_DIR_HOST:-./data/update}/runtime/jobs:/var/lib/myscoutee/update/jobs:ro"
      - "${MYSCOUTEE_UPDATE_CONFIG_DIR_HOST:-./data/update-config}:/etc/myscoutee/update:ro"
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - myscoutee
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      registry:
        condition: service_started
      payment-simulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health | grep -q UP"]
      interval: 30s
      timeout: 5s
      retries: 8
      # Probe promptly during startup; keep the steady-state interval unchanged.
      start_interval: 2s
      start_period: 60s

  # Explore-only registry. This service is never published on a host port and
  # cannot be used as the operator-selected REAL registry.
  registry:
    container_name: registry-demo
    hostname: registry
    image: ${REGISTRY_DEMO_IMAGE:-myscoutee-registry:1.3.0-prod}
    pull_policy: build
    build:
      context: ../../myscoutee-registry
      args:
        MYSCOUTEE_VERSION: ${MYSCOUTEE_VERSION:-1.3.0}
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["start-demo"]
    environment:
      REGISTRY_DEMO_SEED: "true"
      REGISTRY_LISTEN_ADDR: ":8080"
      REGISTRY_SCOPE: "demo:myscoutee"
      REGISTRY_DATABASE_PATH: "/data/registry-demo.db"
      REGISTRY_SIGNING_KEY_PATH: "/data/registry-demo-signing-key.pem"
      REGISTRY_GENERATE_SIGNING_KEY: "true"
      REGISTRY_HEALTHCHECK_URL: "http://127.0.0.1:8080/healthz"
    volumes:
      - registry-demo-data:/data
    networks:
      - myscoutee
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/registry", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10
      # Probe promptly during startup; keep the steady-state interval unchanged.
      start_interval: 2s
      start_period: 5s
    stop_grace_period: 15s

  # Internal demo payment provider. Its browser surfaces are published only
  # through the deployment nginx origin; provider APIs stay on the Compose
  # network and are selected only for DEMO sessions by profilemanagement.
  payment-simulator:
    container_name: payment-simulator
    hostname: payment-simulator
    image: ${PAYMENT_SIMULATOR_IMAGE:-myscoutee-payment-simulator:1.3.0-prod}
    pull_policy: build
    build:
      context: ../../myscoutee-payment-simulator
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.secrets
    environment:
      PAYMENT_SIMULATOR_LISTEN_ADDR: ":18082"
      PAYMENT_SIMULATOR_ALLOW_NON_LOOPBACK: "true"
      PAYMENT_SIMULATOR_PUBLIC_BASE_URL: "${PAYMENT_SIMULATOR_PUBLIC_BASE_URL:-https://localhost}"
      PAYMENT_SIMULATOR_DATABASE_PATH: "/data/payment-simulator.db"
      PAYMENT_SIMULATOR_WEBHOOK_URL: "http://profilemanagement:8080/payment/webhooks/stripe"
      PAYMENT_SIMULATOR_BARION_CALLBACK_URL: "http://profilemanagement:8080/payment/webhooks/barion"
      PAYMENT_SIMULATOR_REQUIRE_IDEMPOTENCY: "true"
    volumes:
      - payment-simulator-data:/data
    networks:
      - myscoutee
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/payment-simulator", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10
      # Probe promptly during startup; keep the steady-state interval unchanged.
      start_interval: 2s
      start_period: 5s
    stop_grace_period: 15s

volumes:
  registry-demo-data:
    name: "${REGISTRY_DEMO_VOLUME_NAME:-myscoutee-registry-demo-data-v1}"
  registry-demo-client-data:
    name: "${REGISTRY_DEMO_CLIENT_VOLUME_NAME:-myscoutee-registry-demo-client-data-v1}"
  payment-simulator-data:
    name: "${PAYMENT_SIMULATOR_VOLUME_NAME:-myscoutee-payment-simulator-data-v1}"
