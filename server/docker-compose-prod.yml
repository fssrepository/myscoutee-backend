# Production stack.
# Build the frontend production bundle before building this stack. The nginx
# image bakes frontend/prod into /usr/share/nginx/html.

networks:
  myscoutee:
    driver: bridge

secrets:
  firebase-service-account:
    file: ./projects/profile/secrets/firebase-service-account.json

services:
  # certbot:
  #   image: ${CERT_BOT}
  #   container_name: certbot
  #   hostname: certbot
  #   networks:
  #     - myscoutee
  #   environment:
  #     - RENEWAL_INTERVAL=12h
  #   entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep $${RENEWAL_INTERVAL} & wait $${!}; done;'"
  #   volumes:
  #    - ./data/certbot/conf:/etc/letsencrypt
  #    - ./data/certbot/www:/var/www/certbot
  #   depends_on:
  #     - nginx
  nginx:
    container_name: nginx
    hostname: nginx
    image: ${NGINX_PRODUCTION_IMAGE:-myscoutee-nginx:1.0.0-prod}
    pull_policy: build
    restart: unless-stopped
    build:
      context: docker
      dockerfile: images/nginx/prod/Dockerfile
      additional_contexts:
        frontend-prod: ../frontend/prod
      args:
        NGINX_BASE_IMAGE: ${NGINX_BASE_IMAGE:-myscoutee-nginx:1.0.0-base}
        TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
    environment:
      TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
      LETSENCRYPT_ENABLED: ${LETSENCRYPT_ENABLED:-false}
      DOMAIN: ${DOMAIN:-myscoutee.com}
    #  WAIT_FOR: profilemanagement:8080
    ports:
      - 80:80
      - 443:443
      - 127.0.0.1:27017:27017
    volumes:
      - ./docker/conf/nginx/keys:/etc/nginx/keys
      #- ./docker/scripts:/scripts
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - myscoutee
    depends_on:
      - mongodb
      - redis
      - profilemanagement
      #- certbot
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    #command: ["/scripts/wait-for-it.sh", "-t", "0", "profilemanagement:8080", "--", "nginx", "-g", "daemon off;"]
  mongodb:
    image: ${MONGO_IMAGE}
    container_name: mongodb
    hostname: mongodb
    restart: unless-stopped
    env_file:
      - .env.secrets
    #restart: always
    #entrypoint: [ "/usr/bin/mongod", "--bind_ip_all", "--replSet", "rs0" ]
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_REAL_DATABASE}
      MONGO_APP_DATABASE: ${MONGO_REAL_DATABASE}
      MONGO_SEED_DIRECTORY: myscoutee_db
      MONGO_IMPORT_ALL_SEED_DATABASES: "true"
      MONGO_IMPORT_ALLOWED_COLLECTIONS_BY_DB: ${MONGO_IMPORT_ALLOWED_COLLECTIONS_BY_DB}
      TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
    volumes:
      - ./docker/conf/mongodb/:/docker-entrypoint-initdb.d
      - ./data/mongodb/data-v8-0:/data/db
      - ./docker/scripts:/scripts
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - myscoutee
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$${MONGO_APP_USERNAME:-guest}\" --password \"$${MONGO_APP_PASSWORD:-guest}\" --authenticationDatabase \"$${MONGO_APP_DATABASE:-myscoutee_db}\" \"$${MONGO_APP_DATABASE:-myscoutee_db}\" --eval 'db.runCommand({ ping: 1 }).ok' | grep -q 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    #ports:
    #  - 127.0.0.1:27017:27017
  redis:
    image: ${REDIS_IMAGE}
    container_name: redis
    hostname: redis
    restart: unless-stopped
    environment:
      TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - myscoutee
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
  minio:
    image: ${MINIO_PRODUCTION_IMAGE:-myscoutee-minio:1.0.0-prod}
    pull_policy: build
    build:
      context: .
      dockerfile: docker/images/minio/Dockerfile
      args:
        MINIO_BASE_IMAGE: ${MINIO_BASE_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    container_name: minio
    hostname: minio
    restart: unless-stopped
    env_file:
      - .env.secrets
    command: server /data --console-address ":9001"
    environment:
      MEDIA_BUCKET: "${MEDIA_BUCKET}"
      MINIO_ENDPOINT: "http://127.0.0.1:9000"
      TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
    volumes:
      - ./data/minio:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - myscoutee
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/myscoutee-minio-seeded && curl -fsS http://localhost:9000/minio/health/live >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
  profilemanagement:
    image: ${MYSCOUTEE_PRODUCTION_IMAGE:-myscoutee-api:1.0.0-prod}
    pull_policy: build
    restart: unless-stopped
    build:
       context: .
       dockerfile: docker/images/profilemanagement/prod/Dockerfile
       args:
         TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
    container_name: myscoutee
    hostname: myscoutee
    env_file:
      - .env.secrets
    environment:
      SPRING_PROFILES_ACTIVE: "prod"
      MYSCOUTEE_VERSION: "${MYSCOUTEE_VERSION:-1.0.0}"
      MONGODB_HOST: "mongodb"
      MONGODB_DATABASE: "${MONGO_REAL_DATABASE}"
      MONGODB_DEMO_DATABASE: "${MONGO_DEMO_DATABASE}"
      SPRING_DATA_REDIS_HOST: "redis"
      SPRING_DATA_REDIS_PORT: "6379"
      FIREBASE_ENABLED: "${FIREBASE_ENABLED:-true}"
      FACEBOOK_APP_SECRET: "${FACEBOOK_APP_SECRET:-}"
      DEV_USER: "dev@myscoutee.local"
      ADMIN_USER: "myscoutee@gmail.com,raxim.uk@gmail.com,myscoutee1@gmail.com"
      OPERATOR_USER: "${OPERATOR_USER:-}"
      OPERATOR_CONFIGURATION_MASTER_KEY_PATH: "/etc/myscoutee/configuration/deployment-master-key"
      WEBSOCKET_ALLOWED_ORIGIN_PATTERNS: "${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:-https://myscoutee.com,https://www.myscoutee.com,http://localhost:8080,http://127.0.0.1:8080}"
      MEDIA_ENABLED: "true"
      MEDIA_OBJECT_STORE_ENDPOINT: "http://minio:9000"
      MEDIA_OBJECT_STORE_REGION: "eu-central-1"
      MEDIA_BUCKET: "${MEDIA_BUCKET}"
      MEDIA_OBJECT_STORE_PATH_STYLE: "true"
      ASSET_SOURCE_REFRESH_ENABLED: "${ASSET_SOURCE_REFRESH_ENABLED}"
      ASSET_SOURCE_REFRESH_ALLOWED_HOSTS: "${ASSET_SOURCE_REFRESH_ALLOWED_HOSTS}"
      REGISTRY_ENABLED: "${REGISTRY_ENABLED:-false}"
      REGISTRY_OUTBOUND_ALLOWED: "${REGISTRY_OUTBOUND_ALLOWED:-false}"
      REGISTRY_OPERATOR_REGISTRATION_CONFIRMED: "${REGISTRY_OPERATOR_REGISTRATION_CONFIRMED:-false}"
      REGISTRY_BASE_URL: "${REGISTRY_BASE_URL:-}"
      REGISTRY_SCOPE: "${REGISTRY_SCOPE:-}"
      REGISTRY_PRIVATE_KEY_PATH: "${REGISTRY_PRIVATE_KEY_PATH:-/etc/myscoutee/registry/deployment-private-key.pem}"
      REGISTRY_PUBLIC_KEY_PATH: "${REGISTRY_PUBLIC_KEY_PATH:-/etc/myscoutee/registry/deployment-public-key.der}"
      REGISTRY_STATE_DIR: "${REGISTRY_STATE_DIR:-/var/lib/myscoutee/registry}"
      REGISTRY_CONNECT_TIMEOUT: "${REGISTRY_CONNECT_TIMEOUT:-5s}"
      REGISTRY_REQUEST_TIMEOUT: "${REGISTRY_REQUEST_TIMEOUT:-15s}"
      REGISTRY_RETRY_DELAY: "${REGISTRY_RETRY_DELAY:-15m}"
      REGISTRY_MAX_RESPONSE_BYTES: "${REGISTRY_MAX_RESPONSE_BYTES:-1048576}"
      REGISTRY_EXPECTED_KEY_FINGERPRINT: "${REGISTRY_EXPECTED_KEY_FINGERPRINT:-}"
      REGISTRY_TRUST_ON_FIRST_USE: "${REGISTRY_TRUST_ON_FIRST_USE:-false}"
      REGISTRY_ALLOW_INSECURE_HTTP: "${REGISTRY_ALLOW_INSECURE_HTTP:-false}"
      REGISTRY_INSECURE_HTTP_ALLOWED_HOSTS: "${REGISTRY_INSECURE_HTTP_ALLOWED_HOSTS:-}"
      OPERATOR_UPDATE_ENABLED: "${MYSCOUTEE_UPDATE_ENABLED:-false}"
      OPERATOR_UPDATE_STATE_DIR: "/var/lib/myscoutee/update"
      OPERATOR_UPDATE_RELEASE_PUBLIC_KEY_PATH: "/etc/myscoutee/update/release-public-key.pem"
      OPERATOR_UPDATE_MAX_ARTIFACT_BYTES: "${MYSCOUTEE_UPDATE_MAX_ARTIFACT_BYTES:-4294967296}"
      OPERATOR_UPDATE_STAGING_SAFETY_RESERVE_BYTES: "${MYSCOUTEE_UPDATE_STAGING_SAFETY_RESERVE_BYTES:-536870912}"
      TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
      JAVA_TOOL_OPTIONS: "--enable-native-access=ALL-UNNAMED -XX:+ExitOnOutOfMemoryError"
    secrets:
      - source: firebase-service-account
        target: firebase-service-account.json
    volumes:
      - "${OPERATOR_CONFIGURATION_KEY_DIR_HOST:-./data/configuration}:/etc/myscoutee/configuration:ro"
      - "${REGISTRY_KEY_DIR_HOST:-./data/registry-keys}:/etc/myscoutee/registry:rw"
      - "${REGISTRY_STATE_DIR_HOST:-./data/registry}:/var/lib/myscoutee/registry"
      - "${MYSCOUTEE_UPDATE_STATE_DIR_HOST:-./data/update}/inbox/staging:/var/lib/myscoutee/update/staging:rw"
      - "${MYSCOUTEE_UPDATE_STATE_DIR_HOST:-./data/update}/inbox/requests:/var/lib/myscoutee/update/requests:rw"
      - "${MYSCOUTEE_UPDATE_STATE_DIR_HOST:-./data/update}/runtime/jobs:/var/lib/myscoutee/update/jobs:ro"
      - "${MYSCOUTEE_UPDATE_CONFIG_DIR_HOST:-./data/update-config}:/etc/myscoutee/update:ro"
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - myscoutee
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health | grep -q UP"]
      interval: 30s
      timeout: 5s
      retries: 8
      start_period: 60s
