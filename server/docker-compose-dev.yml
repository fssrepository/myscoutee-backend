# Development services start only on explicit request, including after a host reboot.
networks:
  myscoutee:
    driver: bridge

services:
  stun:
    extends:
      file: docker-compose-stun.yml
      service: stun
    container_name: myscoutee-stun
    networks:
      - myscoutee

  mcp:
    image: ${MCP_DEV_IMAGE:-myscoutee-mcp:1.4.0-dev}
    build:
      context: ../../myscoutee-mcp
      dockerfile: Dockerfile
    container_name: mcp-dev
    hostname: mcp
    restart: "no"
    environment:
      MYSCOUTEE_MCP_TRANSPORT: http
      MYSCOUTEE_MCP_LISTEN: 0.0.0.0:8080
      MYSCOUTEE_API_BASE_URL: http://profilemanagement:8080
      MYSCOUTEE_PUBLIC_API_BASE_URL: ${MYSCOUTEE_PUBLIC_API_BASE_URL:-http://localhost/api}
    networks:
      - myscoutee
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "/myscoutee-mcp", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s

  # certbot:
  #   image: ${CERT_BOT}
  #   container_name: certbot
  #   hostname: certbot
  #   networks:
  #     - myscoutee
  #   environment:
  #     - RENEWAL_INTERVAL=12h
  #   entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep $${RENEWAL_INTERVAL} & wait $${!}; done;'"
  #   volumes:
  #    - ./data/certbot/conf:/etc/letsencrypt
  #    - ./data/certbot/www:/var/www/certbot
  #   depends_on:
  #     - nginx
  nginx:
    container_name: nginx
    hostname: nginx
    image: ${NGINX_IMAGE:-myscoutee-nginx:1.4.0-dev}
    pull_policy: build
    build:
      context: docker
      dockerfile: images/nginx/dev/Dockerfile
      args:
        NGINX_BASE_IMAGE: ${NGINX_BASE_IMAGE:-myscoutee-nginx:1.4.0-base}
        TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
    environment:
      MYSCOUTEE_RUNTIME_STATUS_TOKEN_FILE: /run/myscoutee-runtime-status/token
      TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
    #  WAIT_FOR: profilemanagement:8080
    ports:
      - 80:80
      - 443:443
      - 127.0.0.1:27017-27019:27017-27019
    volumes:
      - runtime-status-credentials:/run/myscoutee-runtime-status
      - ./docker/conf/nginx/conf/http:/etc/nginx/dev-templates:ro
      - ./docker/images/nginx/dev/nginx-entrypoint.sh:/scripts/nginx-entrypoint.sh:ro
      - ./docker/.qa-mobile-runtime:/var/lib/myscoutee-qa:ro
      - ./docker/conf/nginx/conf/stream:/etc/nginx/stream_conf.d/
      - ./docker/conf/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/conf/nginx/app/myscoutee:/usr/share/nginx/html
      - ./docker/conf/nginx/keys:/etc/nginx/keys
      #- ./docker/scripts:/scripts
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
      - /etc/localtime:/etc/localtime:ro
    networks:
      - myscoutee
    depends_on:
      mcp:
        condition: service_healthy
      mongodb:
        condition: service_started
      redis:
        condition: service_started
      profilemanagement:
        condition: service_healthy
      frontend-sync:
        # Keep serving the last committed static build while the watcher prepares
        # a newer one; a missing dependency build must not block Nginx startup.
        condition: service_started
      #- certbot
    #command: ["/scripts/wait-for-it.sh", "-t", "0", "profilemanagement:8080", "--", "nginx", "-g", "daemon off;"]
  mongodb:
    extends:
      file: docker-compose.replicaset.yml
      service: mongodb
    image: ${MONGO_IMAGE}
    container_name: mongodb
    hostname: mongodb
    env_file:
      # Committed development-only credentials. Production uses .env.secrets.
      - docker-dev.env
      # Retained dev volumes may have a different root account; never rotate it on startup.
      - path: .env.mongo-root.local
        required: false
        format: raw
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DEMO_DATABASE}
      MONGO_APP_DATABASE: ${MONGO_DEMO_DATABASE}
      MONGO_SEED_DIRECTORY: demo_db
      MONGO_IMPORT_ALLOWED_COLLECTIONS_BY_DB: ${MONGO_IMPORT_ALLOWED_COLLECTIONS_BY_DB}
      TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
    volumes:
      - ./docker/conf/mongodb/:/docker-entrypoint-initdb.d
      - ./data/mongodb/demo-data-v8-0:/data/db
      - ./docker/scripts:/scripts
      - /etc/localtime:/etc/localtime:ro
    networks:
      - myscoutee
    #ports:
    #  - 27017-27019:27017-27019
  mongodb-sync:
    image: ${MONGODB_SYNC_IMAGE}
    pull_policy: build
    build:
      context: .
      dockerfile: docker/images/mongodb-sync/dev/Dockerfile
      args:
        TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
    container_name: mongodb-sync
    hostname: mongodb-sync
    env_file:
      - docker-dev.env
    command: ["/usr/local/bin/mongodb-seed-sync"]
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/mongodb-seed-sync.ready"]
      interval: 2s
      timeout: 2s
      retries: 180
      start_period: 30s
    environment:
      MONGO_APP_DATABASE: ${MONGO_DEMO_DATABASE}
      MONGO_DEMO_DATABASE: ${MONGO_DEMO_DATABASE}
      MONGO_SEED_DIRECTORY: demo_db
      MONGO_IMPORT_ALLOWED_COLLECTIONS_BY_DB: ${MONGO_IMPORT_ALLOWED_COLLECTIONS_BY_DB}
      MONGODB_SEED_SYNC_DEBOUNCE_SECONDS: "${MONGODB_SEED_SYNC_DEBOUNCE_SECONDS:-1}"
      MONGODB_SEED_SYNC_RECONCILE_SECONDS: "${MONGODB_SEED_SYNC_RECONCILE_SECONDS:-2}"
      TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
    volumes:
      - ./docker/conf/mongodb:/docker-entrypoint-initdb.d:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - myscoutee
    depends_on:
      - mongodb
  redis:
    image: ${REDIS_IMAGE}
    container_name: redis
    hostname: redis
    environment:
      TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
    volumes:
      - /etc/localtime:/etc/localtime:ro
    networks:
      - myscoutee
  minio:
    image: ${MINIO_DEV_IMAGE:-myscoutee-minio:1.4.0-dev}
    pull_policy: build
    build:
      context: .
      dockerfile: docker/images/minio/Dockerfile
      args:
        MINIO_BASE_IMAGE: ${MINIO_BASE_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    container_name: minio
    hostname: minio
    env_file:
      - docker-dev.env
    command: server /data --console-address ":9001"
    environment:
      MEDIA_BUCKET: "${MEDIA_BUCKET}"
      MINIO_ENDPOINT: "http://127.0.0.1:9000"
      TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
    volumes:
      - ./data/minio:/data
      - ./docker/conf/minio:/seed:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - myscoutee
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/myscoutee-minio-seeded && curl -fsS http://localhost:9000/minio/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
  runtime-directories:
    # Runs once before the unprivileged API; contains no application process.
    image: ${MYSCOUTEE_DEV_IMAGE:-myscoutee-api:1.4.0-dev}
    user: "0:0"
    network_mode: none
    restart: "no"
    entrypoint: ["/bin/sh", "/prepare-runtime-directories.sh"]
    environment:
      MYSCOUTEE_RUNTIME_UID: "${UID:-1000}"
      MYSCOUTEE_RUNTIME_GID: "${GID:-1000}"
      MYSCOUTEE_RUNTIME_DIRECTORIES: "configuration registry-demo-keys registry-demo-state release-simulator"
    volumes:
      - ./data:/workspace/data
      - ./docker/scripts/prepare_dev_runtime_directories.sh:/prepare-runtime-directories.sh:ro
  profilemanagement:
    extends:
      file: docker-compose.replicaset.yml
      service: profilemanagement
    image: ${MYSCOUTEE_DEV_IMAGE:-myscoutee-api:1.4.0-dev}
    pull_policy: build
    build:
      context: .
      dockerfile: docker/images/profilemanagement/dev/Dockerfile
      args:
        TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
    container_name: myscoutee
    hostname: myscoutee
    env_file:
      - docker-dev.env
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    command:
      - bash
      - -lc
      - /bin/sh /workspace/docker/scripts/ensure_operator_configuration_master_key.sh && exec bash /workspace/docker/scripts/start_profilemanagement_dev.sh
    environment:
      MYSCOUTEE_RUNTIME_STATUS_ENABLED: "true"
      MYSCOUTEE_VERSION: "${MYSCOUTEE_VERSION:-1.4.0}"
      MYSCOUTEE_RUNTIME_STATUS_URL: http://nginx:9081/internal/runtime-status
      MYSCOUTEE_RUNTIME_STATUS_TOKEN_FILE: /run/myscoutee-runtime-status/token
      HOME: /workspace
      # Do not share Gradle locks with host-side IDE/CLI daemons. The repository
      # is bind-mounted, so the default /workspace/.gradle path is the host cache.
      GRADLE_USER_HOME: /workspace/.gradle-docker
      PROFILEMANAGEMENT_HOT_RELOAD: "${PROFILEMANAGEMENT_HOT_RELOAD:-true}"
      PROFILEMANAGEMENT_DEBUG_PORT: "${PROFILEMANAGEMENT_DEBUG_PORT:-5005}"
      SPRING_PROFILES_ACTIVE: "dev"
      SPRING_DEVTOOLS_RESTART_ENABLED: "${PROFILEMANAGEMENT_HOT_RELOAD:-true}"
      MONGODB_HOST: "mongodb"
      MONGODB_DATABASE: "${MONGO_DEMO_DATABASE}"
      MONGODB_DEMO_DATABASE: "${MONGO_DEMO_DATABASE}"
      SPRING_DATA_REDIS_HOST: "redis"
      SPRING_DATA_REDIS_PORT: "6379"
      CHAT_STREAM_BLOCK_MS: "${CHAT_STREAM_BLOCK_MS:-10000}"
      CHAT_CALL_STUN_URLS: "${CHAT_CALL_STUN_URLS:-}"
      CHAT_CALL_STUN_PORT: "${CHAT_CALL_STUN_PORT:-3478}"
      USERS_DELETED_ACCOUNT_PURGE_DELAY_MS: "${USERS_DELETED_ACCOUNT_PURGE_DELAY_MS:-60000}"
      FIREBASE_ENABLED: "false"
      AUTH_MAX_ACTIVE_SESSIONS: "${AUTH_MAX_ACTIVE_SESSIONS:--1}"
      INTEGRATION_PUBLIC_BASE_URL: "${INTEGRATION_PUBLIC_BASE_URL:-http://localhost/api/integrations/v1}"
      INTEGRATION_WEBHOOK_ALLOW_HTTP: "true"
      INTEGRATION_WEBHOOK_ALLOW_PRIVATE_ADDRESSES: "true"
      MEMBER_USER: "${MEMBER_USER:-member1@myscoutee.local}"
      OPERATOR_USER: "${OPERATOR_USER:-operator1@myscoutee.local}"
      OPERATOR_CONFIGURATION_MASTER_KEY_PATH: "/workspace/data/configuration/deployment-master-key"
      # Same release/download code as production, with a local signed source.
      OPERATOR_UPDATE_RELEASE_API_ORIGIN: "https://release-simulator:18445"
      OPERATOR_UPDATE_RELEASE_DOWNLOAD_ORIGIN: "https://release-simulator:18445"
      OPERATOR_UPDATE_TLS_CA_CERTIFICATE: "/workspace/data/release-simulator/tls/certificate.pem"
      OPERATOR_UPDATE_RELEASE_PUBLIC_KEY_PATH: "/workspace/data/release-simulator/release-public-key.pem"
      OPERATOR_UPDATE_INCLUDE_PRERELEASES: "true"
      MEDIA_ENABLED: "true"
      MEDIA_OBJECT_STORE_ENDPOINT: "http://minio:9000"
      MEDIA_OBJECT_STORE_REGION: "eu-central-1"
      MEDIA_BUCKET: "${MEDIA_BUCKET}"
      MEDIA_OBJECT_STORE_PATH_STYLE: "true"
      ASSET_SOURCE_REFRESH_ENABLED: "${ASSET_SOURCE_REFRESH_ENABLED}"
      ASSET_SOURCE_REFRESH_ALLOWED_HOSTS: "${ASSET_SOURCE_REFRESH_ALLOWED_HOSTS}"
      REGISTRY_DEMO_BASE_URL: "http://registry:8080"
      REGISTRY_DEMO_SCOPE: "demo:myscoutee"
      REGISTRY_DEMO_PRIVATE_KEY_PATH: "/workspace/data/registry-demo-keys/deployment-private-key.pem"
      REGISTRY_DEMO_PUBLIC_KEY_PATH: "/workspace/data/registry-demo-keys/deployment-public-key.der"
      REGISTRY_DEMO_STATE_DIR: "/workspace/data/registry-demo-state"
      REGISTRY_DEMO_ALLOW_INSECURE_HTTP: "true"
      REGISTRY_DEMO_INSECURE_HTTP_ALLOWED_HOSTS: "registry"
      PAYMENT_ENABLE_PAY: "${PAYMENT_ENABLE_PAY:-true}"
      PAYMENT_REGISTRATION_TTL: "${PAYMENT_REGISTRATION_TTL:-PT1M}"
      PAYMENT_SIMULATOR_ENABLED: "true"
      PAYMENT_EXCHANGE_RATE_DEVELOPMENT_HOSTS: "payment-simulator"
      PAYMENT_SIMULATOR_BASE_URL: "http://payment-simulator:18082"
      PAYMENT_SIMULATOR_API_KEY: "${PAYMENT_STRIPE_API_KEY:-sk_test_myscoutee}"
      PAYMENT_SIMULATOR_REGISTRATION_CALLBACK_URL: "http://profilemanagement:8080/payment-methods/registrations/callback"
      PAYMENT_SIMULATOR_APPLICATION_BASE_URL: "${PAYMENT_SIMULATOR_APPLICATION_BASE_URL:-http://localhost}"
      PAYMENT_SIMULATOR_BARION_MERCHANT_ACCOUNT: "${PAYMENT_SIMULATOR_BARION_MERCHANT_ACCOUNT:-merchant@myscoutee.local}"
      PAYMENT_STRIPE_API_KEY: "${PAYMENT_STRIPE_API_KEY:-sk_test_myscoutee}"
      PAYMENT_STRIPE_API_BASE_URL: "${PAYMENT_STRIPE_API_BASE_URL:-http://payment-simulator:18082}"
      PAYMENT_STRIPE_TEST_GATEWAY_ENABLED: "${PAYMENT_STRIPE_TEST_GATEWAY_ENABLED:-true}"
      PAYMENT_STRIPE_WEBHOOK_SECRET: "${PAYMENT_STRIPE_WEBHOOK_SECRET:-whsec_myscoutee_test}"
      PAYMENT_SIMULATOR_WEBHOOK_SECRET: "${PAYMENT_STRIPE_WEBHOOK_SECRET:-whsec_myscoutee_test}"
      PAYMENT_BARION_API_KEY: "${PAYMENT_BARION_API_KEY:-11111111-1111-4111-8111-111111111111}"
      PAYMENT_BARION_API_BASE_URL: "${PAYMENT_BARION_API_BASE_URL:-http://payment-simulator:18082}"
      PAYMENT_BARION_TEST_GATEWAY_ENABLED: "${PAYMENT_BARION_TEST_GATEWAY_ENABLED:-true}"
      TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
      JAVA_TOOL_OPTIONS: "--enable-native-access=ALL-UNNAMED"
    ports:
      - "127.0.0.1:${PROFILEMANAGEMENT_DEBUG_PORT:-5005}:${PROFILEMANAGEMENT_DEBUG_PORT:-5005}"
    volumes:
      - runtime-status-credentials:/run/myscoutee-runtime-status:ro
      - ./:/workspace
      - /etc/localtime:/etc/localtime:ro
    networks:
      - myscoutee
    healthcheck:
      test: ["CMD-SHELL", "bash -c '>/dev/tcp/127.0.0.1/8080'"]
      interval: 2s
      timeout: 2s
      retries: 120
      start_period: 20s
    depends_on:
      runtime-directories:
        condition: service_completed_successfully
      mongodb:
        condition: service_started
      mongodb-sync:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
      registry:
        condition: service_started
      payment-simulator:
        condition: service_healthy
      release-simulator:
        condition: service_healthy
  frontend-sync:
    image: ${FRONTEND_SYNC_IMAGE:-myscoutee-frontend-sync:1.4.0-dev}
    pull_policy: build
    build:
      context: .
      dockerfile: docker/images/frontend-sync/dev/Dockerfile
      args:
        TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
    container_name: frontend-sync
    hostname: frontend-sync
    user: "${UID:-1000}:${GID:-1000}"
    restart: "no"
    command: >
      bash -c "rm -f /workspace/nginx-html/.frontend-ready;
      exec bash /scripts/frontend_auto_watch.sh"
    environment:
      MYSCOUTEE_VERSION: "${MYSCOUTEE_VERSION:-1.4.0}"
      FRONTEND_ROOT: /workspace/frontend
      FRONTEND_SOURCE_DIR: /workspace/frontend/dev
      FRONTEND_BUILD_CONFIGURATION: dev
      NGINX_HTML_DIR: /workspace/nginx-html
      NG_BUILD_MAX_WORKERS: "12"
      WATCHPACK_POLLING: "${WATCHPACK_POLLING:-true}"
      WATCHPACK_POLLING_INTERVAL: "${WATCHPACK_POLLING_INTERVAL:-1000}"
      CHOKIDAR_USEPOLLING: "${CHOKIDAR_USEPOLLING:-true}"
      CHOKIDAR_INTERVAL: "${CHOKIDAR_INTERVAL:-1000}"
      SYNC_DEBOUNCE_SECONDS: "2"
      TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
    volumes:
      - ../frontend:/workspace/frontend
      - ./docker/conf/nginx/app/myscoutee:/workspace/nginx-html
      - ./docker/scripts/sync_frontend_assets.sh:/scripts/sync_frontend_assets.sh:ro
      - ./docker/scripts/frontend_auto_watch.sh:/scripts/frontend_auto_watch.sh:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - myscoutee
    healthcheck:
      test: ["CMD-SHELL", "test -f /workspace/nginx-html/.frontend-ready"]
      interval: 2s
      timeout: 2s
      retries: 90
  registry:
    container_name: registry
    image: ${LOCAL_REGISTRY_IMAGE:-myscoutee-registry:1.4.0-dev}
    pull_policy: build
    build:
      context: ../../myscoutee-registry
      args:
        MYSCOUTEE_VERSION: ${MYSCOUTEE_VERSION:-1.4.0}
      dockerfile: Dockerfile
    restart: "no"
    command: ["start-demo"]
    environment:
      REGISTRY_DEMO_SEED: "true"
      REGISTRY_LISTEN_ADDR: ":8080"
      REGISTRY_SCOPE: "demo:myscoutee"
      REGISTRY_DATABASE_PATH: "/data/registry-demo.db"
      REGISTRY_SIGNING_KEY_PATH: "/data/registry-demo-signing-key.pem"
      REGISTRY_GENERATE_SIGNING_KEY: "true"
      REGISTRY_CHECKPOINT_INTERVAL: "${LOCAL_REGISTRY_CHECKPOINT_INTERVAL:-10s}"
      REGISTRY_HEALTHCHECK_URL: "http://127.0.0.1:8080/healthz"
    ports:
      - "127.0.0.1:${LOCAL_REGISTRY_PORT:-8081}:8080"
    volumes:
      - registry-dev-demo-data:/data
    networks:
      - myscoutee
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/registry", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
    stop_grace_period: 15s
  release-simulator:
    container_name: release-simulator
    hostname: release-simulator
    image: myscoutee-release-simulator:1.4.0-dev
    build:
      context: docker/images/release-simulator
    user: "${UID:-1000}:${GID:-1000}"
    restart: "no"
    environment:
      RELEASE_SIMULATOR_FAIL_PACKAGE_AFTER_BYTES: "${RELEASE_SIMULATOR_FAIL_PACKAGE_AFTER_BYTES:-}"
    ports:
      - "127.0.0.1:18445:18445"
    volumes:
      - ./data/release-simulator:/data
      - ../guides/qa/tools/operator-update-release-server.py:/workspace/guides/qa/tools/operator-update-release-server.py:ro
      - ./docker/scripts/start_release_simulator.sh:/workspace/server/docker/scripts/start_release_simulator.sh:ro
    networks:
      - myscoutee
    depends_on:
      runtime-directories:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python3", "-c", "import ssl,urllib.request; urllib.request.urlopen('https://localhost:18445/repos/fssrepository/myscoutee/releases', context=ssl.create_default_context(cafile='/data/tls/certificate.pem'), timeout=3).close()"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s
  payment-simulator:
    container_name: payment-simulator
    hostname: payment-simulator
    image: ${PAYMENT_SIMULATOR_IMAGE:-myscoutee-payment-simulator:1.4.0-dev}
    pull_policy: build
    build:
      context: ../../myscoutee-payment-simulator
      dockerfile: Dockerfile
    restart: "no"
    environment:
      PAYMENT_SIMULATOR_LISTEN_ADDR: ":18082"
      PAYMENT_SIMULATOR_ALLOW_NON_LOOPBACK: "true"
      PAYMENT_SIMULATOR_PUBLIC_BASE_URL: "${PAYMENT_SIMULATOR_PUBLIC_BASE_URL:-http://localhost:18082}"
      PAYMENT_SIMULATOR_DATABASE_PATH: "/data/payment-simulator.db"
      PAYMENT_SIMULATOR_API_KEY: "${PAYMENT_STRIPE_API_KEY:-sk_test_myscoutee}"
      PAYMENT_SIMULATOR_WEBHOOK_URL: "http://profilemanagement:8080/payment/webhooks/stripe"
      PAYMENT_SIMULATOR_WEBHOOK_SECRET: "${PAYMENT_STRIPE_WEBHOOK_SECRET:-whsec_myscoutee_test}"
      PAYMENT_SIMULATOR_BARION_POS_KEY: "${PAYMENT_BARION_API_KEY:-11111111-1111-4111-8111-111111111111}"
      PAYMENT_SIMULATOR_BARION_CALLBACK_URL: "http://profilemanagement:8080/payment/webhooks/barion"
      PAYMENT_SIMULATOR_AUDIT_TOKEN: "${PAYMENT_SIMULATOR_AUDIT_TOKEN:-myscoutee-payment-audit-test}"
      PAYMENT_SIMULATOR_REQUIRE_IDEMPOTENCY: "true"
    ports:
      - "127.0.0.1:${PAYMENT_SIMULATOR_PORT:-18082}:18082"
    volumes:
      - payment-simulator-dev-data:/data
    networks:
      - myscoutee
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/payment-simulator", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
    stop_grace_period: 15s

volumes:
  runtime-status-credentials: {}
  registry-dev-demo-data:
    name: "${LOCAL_REGISTRY_DEMO_VOLUME_NAME:-myscoutee-registry-dev-demo-data-v1}"
  payment-simulator-dev-data:
    name: "${PAYMENT_SIMULATOR_VOLUME_NAME:-myscoutee-payment-simulator-dev-data-v1}"
