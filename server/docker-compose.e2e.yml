# Standalone, disposable, production-style stack for functional and stress E2E.
#
# Build and start:
#   docker compose -f docker-compose.e2e.yml up --build --wait
#
# Destroy the stack and all disposable state:
#   docker compose -f docker-compose.e2e.yml down --volumes --remove-orphans
#
# Do not layer this file over docker-compose-dev.yml. Runtime containers contain
# built artifacts only: no source mounts, Gradle bootRun, frontend watch, or seed
# synchronization processes. Nginx uses the production redirect/HSTS policy and
# a short-lived self-signed certificate generated inside the disposable container.

name: myscoutee-e2e

networks:
  e2e:
    driver: bridge

volumes:
  nginx-state: {}
  runtime-status-credentials: {}
  mongodb-data:
  minio-data:
  operator-configuration:
  registry-demo-data:
  registry-demo-client-data:
  payment-simulator-data:

secrets:
  github-packages:
    file: ${MYSCOUTEE_GITHUB_PACKAGES_PROPERTIES:-${HOME}/.gradle/gradle.properties}
  npmrc:
    file: ${NPM_CONFIG_USERCONFIG:-${HOME}/.npmrc}

services:
  stun:
    extends:
      file: docker-compose-stun.yml
      service: stun
    container_name: myscoutee-e2e-stun
    hostname: stun
    networks:
      - e2e
    ports: !override
      - "${CHAT_CALL_E2E_STUN_PORT:-13478}:3478/udp"
      - "${CHAT_CALL_E2E_STUN_PORT:-13478}:3478/tcp"

  mcp:
    image: ${MCP_E2E_IMAGE:-myscoutee-mcp:1.5.0-e2e}
    build:
      context: ../config/mcp
      dockerfile: ../../server/docker/images/mcp/Dockerfile
    container_name: mcp-e2e
    hostname: mcp
    restart: "no"
    environment:
      MYSCOUTEE_MCP_TRANSPORT: http
      MYSCOUTEE_MCP_LISTEN: 0.0.0.0:8080
      MYSCOUTEE_API_BASE_URL: http://profilemanagement:8080
      MYSCOUTEE_PUBLIC_API_BASE_URL: ${MYSCOUTEE_PUBLIC_API_BASE_URL:-http://localhost/api}
    networks:
      - e2e
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "/myscoutee-mcp", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s

  mongodb:
    extends:
      file: docker-compose.replicaset.yml
      service: mongodb
    image: ${MONGODB_E2E_IMAGE:-myscoutee-mongodb:1.5.0-e2e}
    build:
      context: docker/images/mongodb/e2e
      dockerfile: Dockerfile
      additional_contexts:
        mongo-seed: ./docker/conf/mongodb
      args:
        MONGO_BASE_IMAGE: ${MONGO_IMAGE:-mongo:8.0.4}
    container_name: mongodb
    hostname: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: e2e-root-only
      MONGO_APP_USERNAME: guest
      MONGO_APP_PASSWORD: guest
      MONGO_INITDB_DATABASE: ${MONGO_E2E_DATABASE:-e2e_db}
      MONGO_APP_DATABASE: ${MONGO_E2E_DATABASE:-e2e_db}
      MONGO_DEMO_DATABASE: ${MONGO_E2E_DATABASE:-e2e_db}
      MONGO_REAL_DATABASE: ${MONGO_E2E_DATABASE:-e2e_db}
      MONGO_E2E_DATABASE: ${MONGO_E2E_DATABASE:-e2e_db}
      MONGO_SEED_DIRECTORY: e2e_db
      MONGO_IMPORT_ALLOWED_COLLECTIONS_BY_DB: ${MONGO_E2E_DATABASE:-e2e_db}:*
      TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
    volumes:
      - mongodb-data:/data/db
    networks:
      - e2e
    healthcheck:
      test: ["CMD", "bash", "/docker-entrypoint-initdb.d/replica-health"]
      interval: 2s
      timeout: 10s
      retries: 60
      start_period: 30s

  redis:
    image: ${REDIS_IMAGE:-redis:8.6.1-alpine}
    container_name: redis
    hostname: redis
    environment:
      TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
    networks:
      - e2e
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s

  minio:
    image: ${MINIO_E2E_IMAGE:-myscoutee-minio:1.5.0-e2e}
    build:
      context: .
      dockerfile: docker/images/minio/Dockerfile
      args:
        MINIO_BASE_IMAGE: ${MINIO_BASE_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    container_name: minio
    hostname: minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MEDIA_BUCKET: ${MEDIA_BUCKET:-myscoutee-media}
      MINIO_ENDPOINT: http://127.0.0.1:9000
      TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
    volumes:
      - minio-data:/data
    networks:
      - e2e
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/myscoutee-minio-seeded && curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s

  registry:
    image: ${REGISTRY_E2E_IMAGE:-ghcr.io/fssrepository/myscoutee-registry:1.5.0@sha256:73372bc0f22d71f1d6cb68fc7d8b5a9a60b920f33d703e4883f39470bf67838a}
    container_name: registry-e2e
    hostname: registry
    command: ["start-demo"]
    environment:
      REGISTRY_DEMO_SEED: "true"
      REGISTRY_LISTEN_ADDR: ":8080"
      REGISTRY_SCOPE: "demo:myscoutee"
      REGISTRY_DATABASE_PATH: "/data/e2e-demo-registry.db"
      REGISTRY_SIGNING_KEY_PATH: "/data/e2e-demo-signing-key.pem"
      REGISTRY_GENERATE_SIGNING_KEY: "true"
      REGISTRY_CHECKPOINT_INTERVAL: "10s"
      REGISTRY_HEALTHCHECK_URL: "http://127.0.0.1:8080/healthz"
    volumes:
      - registry-demo-data:/data
    networks:
      - e2e
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/registry", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
    stop_grace_period: 15s

  payment-simulator:
    image: ${PAYMENT_SIMULATOR_E2E_IMAGE:-ghcr.io/fssrepository/myscoutee-payment-simulator:1.5.0@sha256:341859243150ae3c41f5d8c03399078915ddaab177cfb70f8ecfc56a998ba7e3}
    container_name: payment-simulator
    hostname: payment-simulator
    environment:
      PAYMENT_SIMULATOR_LISTEN_ADDR: ":18082"
      PAYMENT_SIMULATOR_ALLOW_NON_LOOPBACK: "true"
      PAYMENT_SIMULATOR_PUBLIC_BASE_URL: "https://127.0.0.1"
      PAYMENT_SIMULATOR_DATABASE_PATH: "/data/payment-simulator.db"
      PAYMENT_SIMULATOR_API_KEY: "sk_test_myscoutee_e2e"
      PAYMENT_SIMULATOR_WEBHOOK_URL: "http://profilemanagement:8080/payment/webhooks/stripe"
      PAYMENT_SIMULATOR_WEBHOOK_SECRET: "whsec_myscoutee_e2e"
      PAYMENT_SIMULATOR_BARION_POS_KEY: "11111111-1111-4111-8111-111111111111"
      PAYMENT_SIMULATOR_BARION_CALLBACK_URL: "http://profilemanagement:8080/payment/webhooks/barion"
      PAYMENT_SIMULATOR_AUDIT_TOKEN: "myscoutee-payment-audit-e2e"
      PAYMENT_SIMULATOR_REQUIRE_IDEMPOTENCY: "true"
    volumes:
      - payment-simulator-data:/data
    networks:
      - e2e
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/payment-simulator", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
    stop_grace_period: 15s

  profilemanagement:
    extends:
      file: docker-compose.replicaset.yml
      service: profilemanagement
    image: ${MYSCOUTEE_E2E_IMAGE:-myscoutee-api:1.5.0-e2e}
    build:
      context: .
      dockerfile: docker/images/profilemanagement/e2e/Dockerfile
      secrets:
        - github-packages
      args:
        MYSCOUTEE_VERSION: ${MYSCOUTEE_VERSION:-1.5.0}
    container_name: myscoutee
    hostname: profilemanagement
    environment:
      MYSCOUTEE_RUNTIME_STATUS_ENABLED: "true"
      MYSCOUTEE_RUNTIME_STATUS_URL: http://nginx:9081/internal/runtime-status
      MYSCOUTEE_RUNTIME_STATUS_TOKEN_FILE: /run/myscoutee-runtime-status/token
      AUTH_REGION_SECURITY_ENABLED: ${AUTH_REGION_SECURITY_ENABLED:-true}
      SPRING_PROFILES_ACTIVE: "prod"
      SPRING_DEVTOOLS_RESTART_ENABLED: "false"
      SPRING_DEVTOOLS_ADD_PROPERTIES: "false"
      E2E_MODE: "true"
      MYSCOUTEE_VERSION: ${MYSCOUTEE_VERSION:-1.5.0}
      MONGO_APP_USERNAME: guest
      MONGO_APP_PASSWORD: guest
      MONGODB_HOST: mongodb
      MONGODB_DATABASE: ${MONGO_E2E_DATABASE:-e2e_db}
      MONGODB_DEMO_DATABASE: ${MONGO_E2E_DATABASE:-e2e_db}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      CHAT_STREAM_BLOCK_MS: "10000"
      CHAT_CALL_STUN_PORT: "${CHAT_CALL_E2E_STUN_PORT:-13478}"
      FIREBASE_ENABLED: "false"
      AUTH_MAX_ACTIVE_SESSIONS: "${AUTH_MAX_ACTIVE_SESSIONS:--1}"
      INTEGRATION_PUBLIC_BASE_URL: "http://localhost/api/integrations/v1"
      INTEGRATION_WEBHOOK_ALLOW_HTTP: "true"
      INTEGRATION_WEBHOOK_ALLOW_PRIVATE_ADDRESSES: "true"
      MEMBER_USER: member1@myscoutee.local
      OPERATOR_USER: operator1@myscoutee.local
      OPERATOR_BOOTSTRAP_EMAIL: ""
      OPERATOR_BOOTSTRAP_PASSWORD_SHA256: ""
      OPERATOR_BOOTSTRAP_ALLOW_INSECURE: "false"
      OPERATOR_CONFIGURATION_MASTER_KEY_PATH: /etc/myscoutee/configuration/deployment-master-key
      WEBSOCKET_ALLOWED_ORIGIN_PATTERNS: http://localhost,http://127.0.0.1,http://localhost:80,http://127.0.0.1:80,https://localhost,https://127.0.0.1,https://localhost:443,https://127.0.0.1:443
      ADMIN_STATS_ENABLED: "false"
      AFFINITY_RECOMPUTE_ENABLED: "true"
      EVENTS_SCHEDULER_CHECK_DELAY_MS: "5000"
      EVENTS_WAITLIST_INVITER_ENABLED: "true"
      EVENTS_WAITLIST_INVITER_CHECK_DELAY_MS: "5000"
      MEDIA_ENABLED: "true"
      MEDIA_OBJECT_STORE_ENDPOINT: http://minio:9000
      MEDIA_OBJECT_STORE_REGION: eu-central-1
      MEDIA_OBJECT_STORE_ACCESS_KEY: minioadmin
      MEDIA_OBJECT_STORE_SECRET_KEY: minioadmin
      MEDIA_BUCKET: ${MEDIA_BUCKET:-myscoutee-media}
      MEDIA_OBJECT_STORE_PATH_STYLE: "true"
      PAYMENT_ENABLE_PAY: "true"
      PAYMENT_SIMULATOR_ENABLED: "true"
      PAYMENT_SIMULATOR_BASE_URL: http://payment-simulator:18082
      PAYMENT_SIMULATOR_API_KEY: sk_test_myscoutee_e2e
      PAYMENT_SIMULATOR_REGISTRATION_CALLBACK_URL: http://profilemanagement:8080/payment-methods/registrations/callback
      PAYMENT_SIMULATOR_APPLICATION_BASE_URL: https://127.0.0.1
      PAYMENT_SIMULATOR_BARION_MERCHANT_ACCOUNT: merchant@myscoutee.invalid
      PAYMENT_STRIPE_API_KEY: sk_test_myscoutee_e2e
      PAYMENT_STRIPE_API_BASE_URL: http://payment-simulator:18082
      PAYMENT_STRIPE_TEST_GATEWAY_ENABLED: "true"
      PAYMENT_STRIPE_WEBHOOK_SECRET: whsec_myscoutee_e2e
      PAYMENT_BARION_API_KEY: 11111111-1111-4111-8111-111111111111
      PAYMENT_BARION_API_BASE_URL: http://payment-simulator:18082
      PAYMENT_BARION_TEST_GATEWAY_ENABLED: "true"
      ASSET_SOURCE_REFRESH_ENABLED: "false"
      ASSET_SOURCE_REFRESH_ALLOWED_HOSTS: ""
      REGISTRY_ENABLED: "false"
      REGISTRY_OUTBOUND_ALLOWED: "false"
      REGISTRY_OPERATOR_REGISTRATION_CONFIRMED: "false"
      REGISTRY_BASE_URL: ""
      REGISTRY_SCOPE: ""
      REGISTRY_DEMO_BASE_URL: http://registry:8080
      REGISTRY_DEMO_SCOPE: demo:myscoutee
      REGISTRY_DEMO_PRIVATE_KEY_PATH: /var/lib/myscoutee/registry-demo/keys/deployment-private-key.pem
      REGISTRY_DEMO_PUBLIC_KEY_PATH: /var/lib/myscoutee/registry-demo/keys/deployment-public-key.der
      REGISTRY_DEMO_STATE_DIR: /var/lib/myscoutee/registry-demo/state
      REGISTRY_DEMO_ALLOW_INSECURE_HTTP: "true"
      REGISTRY_DEMO_INSECURE_HTTP_ALLOWED_HOSTS: registry
      OPERATOR_UPDATE_ENABLED: "false"
      OPERATOR_TLS_ENABLED: "false"
      EMAIL_ENABLED: "false"
      EMAIL_PROMOTIONS_ENABLED: "false"
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_DATA_MONGODB_CORE_MONGOTEMPLATE: WARN
      JAVA_TOOL_OPTIONS: --enable-native-access=ALL-UNNAMED -XX:+ExitOnOutOfMemoryError -Xms512m -Xmx2g
      TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
    volumes:
      - runtime-status-credentials:/run/myscoutee-runtime-status:ro
      - operator-configuration:/etc/myscoutee/configuration
      - registry-demo-client-data:/var/lib/myscoutee/registry-demo
    networks:
      - e2e
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      registry:
        condition: service_healthy
      payment-simulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health | grep -Fq '\"status\":\"UP\"'"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 20s
    stop_grace_period: 30s

  nginx:
    image: ${NGINX_E2E_IMAGE:-myscoutee-nginx:1.5.0-e2e}
    build:
      context: docker/images/nginx/e2e
      dockerfile: Dockerfile
      secrets:
        - npmrc
      additional_contexts:
        frontend-source: ../frontend
        nginx-config: ../config/nginx
        nginx-partitions: ./docker/conf/mongodb/e2e_db
    container_name: nginx
    hostname: nginx
    environment:
      AUTH_REGION_SECURITY_ENABLED: ${AUTH_REGION_SECURITY_ENABLED:-true}
      MYSCOUTEE_RUNTIME_STATUS_TOKEN_FILE: /run/myscoutee-runtime-status/token
    volumes:
      - runtime-status-credentials:/run/myscoutee-runtime-status
      - nginx-state:/var/lib/nginx/myscoutee
      - ../config/nginx/operator:/etc/nginx/myscoutee-operator:ro
    ports:
      - "${E2E_BIND_ADDRESS:-127.0.0.1}:${E2E_HTTP_PORT:-80}:80"
      - "${E2E_BIND_ADDRESS:-127.0.0.1}:443:443"
    networks:
      - e2e
    depends_on:
      mcp:
        condition: service_healthy
      profilemanagement:
        condition: service_healthy
      payment-simulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
