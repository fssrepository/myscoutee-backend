# Standalone, disposable, production-style stack for functional and stress E2E.
#
# Build and start:
#   docker compose -f docker-compose.e2e.yml up --build --wait
#
# Destroy the stack and all disposable state:
#   docker compose -f docker-compose.e2e.yml down --volumes --remove-orphans
#
# Do not layer this file over docker-compose-dev.yml. Runtime containers contain
# built artifacts only: no source mounts, Gradle bootRun, frontend watch, or seed
# synchronization processes. Nginx uses the production redirect/HSTS policy and
# a short-lived self-signed certificate generated inside the disposable container.

name: myscoutee-e2e

networks:
  e2e:
    driver: bridge

volumes:
  mongodb-data:
  minio-data:
  operator-configuration:
  registry-demo-data:
  registry-demo-client-data:

services:
  mongodb:
    image: ${MONGODB_E2E_IMAGE:-myscoutee-mongodb:1.0.0-e2e}
    build:
      context: docker/images/mongodb/e2e
      dockerfile: Dockerfile
      additional_contexts:
        mongo-seed: ./docker/conf/mongodb
      args:
        MONGO_BASE_IMAGE: ${MONGO_IMAGE:-mongo:8.0.4}
    container_name: mongodb
    hostname: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: e2e-root-only
      MONGO_APP_USERNAME: guest
      MONGO_APP_PASSWORD: guest
      MONGO_INITDB_DATABASE: ${MONGO_E2E_DATABASE:-e2e_db}
      MONGO_APP_DATABASE: ${MONGO_E2E_DATABASE:-e2e_db}
      MONGO_DEMO_DATABASE: ${MONGO_E2E_DATABASE:-e2e_db}
      MONGO_REAL_DATABASE: ${MONGO_E2E_DATABASE:-e2e_db}
      MONGO_E2E_DATABASE: ${MONGO_E2E_DATABASE:-e2e_db}
      MONGO_SEED_DIRECTORY: e2e_db
      MONGO_IMPORT_ALLOWED_COLLECTIONS_BY_DB: ${MONGO_E2E_DATABASE:-e2e_db}:*
      TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
    volumes:
      - mongodb-data:/data/db
    networks:
      - e2e
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$${MONGO_APP_USERNAME}\" --password \"$${MONGO_APP_PASSWORD}\" --authenticationDatabase \"$${MONGO_APP_DATABASE}\" \"$${MONGO_APP_DATABASE}\" --eval 'db.runCommand({ ping: 1 }).ok' | grep -q 1"]
      interval: 2s
      timeout: 10s
      retries: 60
      start_period: 30s

  redis:
    image: ${REDIS_IMAGE:-redis:8.6.1-alpine}
    container_name: redis
    hostname: redis
    environment:
      TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
    networks:
      - e2e
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s

  minio:
    image: ${MINIO_E2E_IMAGE:-myscoutee-minio:1.0.0-e2e}
    build:
      context: .
      dockerfile: docker/images/minio/Dockerfile
      args:
        MINIO_BASE_IMAGE: ${MINIO_BASE_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    container_name: minio
    hostname: minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MEDIA_BUCKET: ${MEDIA_BUCKET:-myscoutee-media}
      MINIO_ENDPOINT: http://127.0.0.1:9000
      TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
    volumes:
      - minio-data:/data
    networks:
      - e2e
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/myscoutee-minio-seeded && curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s

  registry:
    image: ${REGISTRY_E2E_IMAGE:-myscoutee-registry:1.0.0-e2e}
    build:
      context: ../../myscoutee-registry
      dockerfile: Dockerfile
    container_name: registry
    hostname: registry
    command: ["start-demo"]
    environment:
      REGISTRY_DEMO_SEED: "true"
      REGISTRY_LISTEN_ADDR: ":8080"
      REGISTRY_SCOPE: "demo:myscoutee"
      REGISTRY_DATABASE_PATH: "/data/e2e-demo-registry.db"
      REGISTRY_SIGNING_KEY_PATH: "/data/e2e-demo-signing-key.pem"
      REGISTRY_GENERATE_SIGNING_KEY: "true"
      REGISTRY_CHECKPOINT_INTERVAL: "10s"
      REGISTRY_HEALTHCHECK_URL: "http://127.0.0.1:8080/healthz"
    volumes:
      - registry-demo-data:/data
    networks:
      - e2e
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/registry", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
    stop_grace_period: 15s

  profilemanagement:
    image: ${MYSCOUTEE_E2E_IMAGE:-myscoutee-api:1.0.0-e2e}
    build:
      context: .
      dockerfile: docker/images/profilemanagement/e2e/Dockerfile
    container_name: myscoutee
    hostname: profilemanagement
    environment:
      SPRING_PROFILES_ACTIVE: "prod"
      SPRING_DEVTOOLS_RESTART_ENABLED: "false"
      SPRING_DEVTOOLS_ADD_PROPERTIES: "false"
      E2E_MODE: "true"
      MYSCOUTEE_VERSION: ${MYSCOUTEE_VERSION:-1.0.0}
      MONGO_APP_USERNAME: guest
      MONGO_APP_PASSWORD: guest
      MONGODB_HOST: mongodb
      MONGODB_DATABASE: ${MONGO_E2E_DATABASE:-e2e_db}
      MONGODB_DEMO_DATABASE: ${MONGO_E2E_DATABASE:-e2e_db}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      CHAT_STREAM_BLOCK_MS: "100"
      FIREBASE_ENABLED: "false"
      MEMBER_USER: member1@myscoutee.local
      OPERATOR_USER: operator1@myscoutee.local
      OPERATOR_BOOTSTRAP_EMAIL: ""
      OPERATOR_BOOTSTRAP_PASSWORD_SHA256: ""
      OPERATOR_BOOTSTRAP_ALLOW_INSECURE: "false"
      OPERATOR_CONFIGURATION_MASTER_KEY_PATH: /etc/myscoutee/configuration/deployment-master-key
      WEBSOCKET_ALLOWED_ORIGIN_PATTERNS: http://localhost,http://127.0.0.1,http://localhost:80,http://127.0.0.1:80,https://localhost,https://127.0.0.1,https://localhost:443,https://127.0.0.1:443
      ADMIN_STATS_ENABLED: "false"
      AFFINITY_RECOMPUTE_ENABLED: "true"
      AFFINITY_RECOMPUTE_CHANGE_STREAM_ENABLED: "false"
      AFFINITY_RECOMPUTE_CHANGE_STREAM_FALLBACK_POLL_ENABLED: "true"
      EVENTS_SCHEDULER_CHECK_DELAY_MS: "5000"
      EVENTS_WAITLIST_INVITER_ENABLED: "true"
      EVENTS_WAITLIST_INVITER_CHECK_DELAY_MS: "5000"
      MEDIA_ENABLED: "true"
      MEDIA_OBJECT_STORE_ENDPOINT: http://minio:9000
      MEDIA_OBJECT_STORE_REGION: eu-central-1
      MEDIA_OBJECT_STORE_ACCESS_KEY: minioadmin
      MEDIA_OBJECT_STORE_SECRET_KEY: minioadmin
      MEDIA_BUCKET: ${MEDIA_BUCKET:-myscoutee-media}
      MEDIA_OBJECT_STORE_PATH_STYLE: "true"
      PAYMENT_ENABLE_PAY: "false"
      ASSET_SOURCE_REFRESH_ENABLED: "false"
      ASSET_SOURCE_REFRESH_ALLOWED_HOSTS: ""
      REGISTRY_ENABLED: "false"
      REGISTRY_OUTBOUND_ALLOWED: "false"
      REGISTRY_OPERATOR_REGISTRATION_CONFIRMED: "false"
      REGISTRY_BASE_URL: ""
      REGISTRY_SCOPE: ""
      REGISTRY_DEMO_BASE_URL: http://registry:8080
      REGISTRY_DEMO_SCOPE: demo:myscoutee
      REGISTRY_DEMO_PRIVATE_KEY_PATH: /var/lib/myscoutee/registry-demo/keys/deployment-private-key.pem
      REGISTRY_DEMO_PUBLIC_KEY_PATH: /var/lib/myscoutee/registry-demo/keys/deployment-public-key.der
      REGISTRY_DEMO_STATE_DIR: /var/lib/myscoutee/registry-demo/state
      REGISTRY_DEMO_ALLOW_INSECURE_HTTP: "true"
      REGISTRY_DEMO_INSECURE_HTTP_ALLOWED_HOSTS: registry
      OPERATOR_UPDATE_ENABLED: "false"
      OPERATOR_TLS_ENABLED: "false"
      EMAIL_ENABLED: "false"
      EMAIL_PROMOTIONS_ENABLED: "false"
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_DATA_MONGODB_CORE_MONGOTEMPLATE: WARN
      JAVA_TOOL_OPTIONS: --enable-native-access=ALL-UNNAMED -XX:+ExitOnOutOfMemoryError -Xms512m -Xmx2g
      TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
    volumes:
      - operator-configuration:/etc/myscoutee/configuration
      - registry-demo-client-data:/var/lib/myscoutee/registry-demo
    networks:
      - e2e
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health | grep -Fq '\"status\":\"UP\"'"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 20s
    stop_grace_period: 30s

  nginx:
    image: ${NGINX_E2E_IMAGE:-myscoutee-nginx:1.0.0-e2e}
    build:
      context: docker/images/nginx/e2e
      dockerfile: Dockerfile
      additional_contexts:
        frontend-source: ../frontend
        nginx-config: ./docker/conf/nginx
    container_name: nginx
    hostname: nginx
    ports:
      - "${E2E_BIND_ADDRESS:-127.0.0.1}:${E2E_HTTP_PORT:-80}:80"
      - "${E2E_BIND_ADDRESS:-127.0.0.1}:443:443"
    networks:
      - e2e
    depends_on:
      profilemanagement:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
