# Shared steps are pinned by the lab bootstrap; project settings stay here.
include:
  - project: "$LAB_CI_PATH"
    ref: "$LAB_CI_REF"
    file: /ci/project.gitlab-ci.yml
variables:
  LAB_APPLICATION: "true"
  LAB_FRONTEND: "false"
  LAB_GITHUB_REPOSITORY: "fssrepository/myscoutee-backend"
  LAB_HEAVY_BUILD: "false"
  LAB_KUBE_CONTEXT: "myscoutee/ci:backend-kvm"
  LAB_KUBE_NAMESPACE: "myscoutee-msc121"
  MYSCOUTEE_COMPATIBLE_PACKAGE_VERSIONS: "1.5.0"
