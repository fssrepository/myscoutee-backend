# Lab ingress around the existing production frontend image. No frontend build.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
worker_processes 1;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    limit_req_zone $binary_remote_addr zone=mcp_registration:1m rate=6r/m;
    map $uri $metrics_backend {
        default "";
        @METRICS_UPSTREAMS@
    }
    # Host monitoring reaches this guest-only NodePort. Business/internal APIs
    # cannot be routed through this listener; the public listener denies metrics.
    server {
        listen 8082;
        resolver @CLUSTER_DNS@ valid=30s ipv6=off;
        location /metrics/ {
            if ($metrics_backend = "") { return 404; }
            rewrite ^ /metrics break;
            proxy_pass http://$metrics_backend;
            proxy_connect_timeout 1s;
            proxy_read_timeout 4s;
        }
        location / { return 404; }
    }
    # Specific routes precede their owning broader prefix. Paths mirror the
    # canonical public controllers; internal and repository routes stay private.
    map $uri $backend {
        default "";
        ~^/api/activities/events/checkout/slots(?:/|$) community.@NAMESPACE@.svc.cluster.local:8080;
        ~^/api/activities/events/(?:checkout|pay)(?:/|$) payments.@NAMESPACE@.svc.cluster.local:8080;
        ~^/api/activities/events/following(?:/|$) identity.@NAMESPACE@.svc.cluster.local:8080;
        ~^/api/admin/content-moderation(?:/|$) community.@NAMESPACE@.svc.cluster.local:8080;
        ~^/api/(?:help|privacy|terms|explanation)(?:/|$) community.@NAMESPACE@.svc.cluster.local:8080;
        ~^/api/public/email/unsubscribe(?:/|$) communication.@NAMESPACE@.svc.cluster.local:8080;
        ~^/api/(?:activities/chats|notifications|i18n|operator/email-configuration)(?:/|$) communication.@NAMESPACE@.svc.cluster.local:8080;
        ~^/api/(?:assets|media)(?:/|$) assets.@NAMESPACE@.svc.cluster.local:8080;
        ~^/api/(?:activities/rates|user-rates)(?:/|$) affinity.@NAMESPACE@.svc.cluster.local:8080;
        ~^/api/(?:payment-methods|payment/webhooks|admin/payment-simulator)(?:/|$) payments.@NAMESPACE@.svc.cluster.local:8080;
        ~^/api/(?:activities/events|activities/feed|campaigns|community-announcements|community-cases|groups|landing|operator/community|service-offerings|share-tokens)(?:/|$) community.@NAMESPACE@.svc.cluster.local:8080;
        ~^/api/(?:admin|admin-client/v1|auth|deployment/configuration|game-cards|integrations|mcp/oauth|navigator/contacts|operator)(?:/|$) identity.@NAMESPACE@.svc.cluster.local:8080;
    }
    server {
        listen 8080;
        server_name localhost;
        root /usr/share/nginx/html;
        client_max_body_size 10m;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-MyScoutee-Pod $hostname always;
        include /etc/myscoutee/response-policy.conf;
        # The kubelet writes the cluster DNS resolver into this pod's resolv.conf;
        # the deployment renderer inserts that cluster's actual DNS Service IP.
        resolver @CLUSTER_DNS@ valid=30s ipv6=off;
        include /etc/myscoutee/runtime-status.conf;
        # Retain the monolith's public Spring health contract. Expose this exact
        # endpoint only; aggregate availability remains /api/runtime-status.
        location = /api/health {
            limit_except GET { deny all; }
            set $health_backend identity.@NAMESPACE@.svc.cluster.local:8081;
            proxy_pass http://$health_backend/health;
            proxy_connect_timeout 1s;
            proxy_read_timeout 4s;
        }
        # Preserve the production provider UI boundary: no provider/control APIs.
        location ^~ /simulator-ui/ {
            set $provider payment-simulator.@NAMESPACE@.svc.cluster.local:18082;
            proxy_pass http://$provider;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location ~ ^/(?:configuration-access|authorization-access|configuration-session|authorization-session|register|payment-method-registration-auth|public/payment-method-registrations|public/payment-authorizations|payment-wait|checkout|bank-auth|barion|test)(?:/|$) {
            set $provider payment-simulator.@NAMESPACE@.svc.cluster.local:18082;
            proxy_pass http://$provider;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location ~ ^/mcp(?:/private)?$ {
            set $mcp_backend mcp.@NAMESPACE@.svc.cluster.local:8080;
            proxy_pass http://$mcp_backend;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            client_max_body_size 1m;
            proxy_read_timeout 60s;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /.well-known/oauth-authorization-server {
            set $identity_backend identity.@NAMESPACE@.svc.cluster.local:8080;
            proxy_pass http://$identity_backend/mcp/oauth/metadata;
        }
        location ~ ^/\.well-known/oauth-protected-resource(?:/mcp/private)?$ {
            set $identity_backend identity.@NAMESPACE@.svc.cluster.local:8080;
            proxy_pass http://$identity_backend/mcp/oauth/resource;
        }
        location = /api/mcp/oauth/register {
            client_max_body_size 16k;
            limit_req zone=mcp_registration burst=5 nodelay;
            limit_req_status 429;
            set $identity_backend identity.@NAMESPACE@.svc.cluster.local:8080;
            proxy_pass http://$identity_backend/mcp/oauth/register;
        }
        location = /api/mcp/oauth/token {
            client_max_body_size 16k;
            set $identity_backend identity.@NAMESPACE@.svc.cluster.local:8080;
            proxy_pass http://$identity_backend/mcp/oauth/token;
        }
        location /api/ {
            if ($backend = "") { return 404; }
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
        }
        location = /media/public {
            set $media_backend assets.@NAMESPACE@.svc.cluster.local:8080;
            proxy_pass http://$media_backend;
        }
        location ~ ^/(?:_internal|metrics|health|backend)(?:/|$) { return 404; }
        location ~* \.(?:js|css|wasm|png|svg|ico|webmanifest)$ { try_files $uri =404; }
        location / {
            ssi on;
            ssi_silent_errors on;
            add_header Cache-Control "no-store" always;
            include /etc/myscoutee/response-policy.conf;
            try_files $uri $uri/ /index.html;
        }
    }
}
