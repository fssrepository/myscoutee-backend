apiVersion: v1
kind: ConfigMap
metadata:
  name: runtime
  labels: {app.kubernetes.io/part-of: myscoutee-msc121}
data:
  {{- toYaml .Values.runtime | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-init
  labels: {app.kubernetes.io/part-of: myscoutee-msc121}
data:
  db_init.js: |
    {{- .Values.shared.mongoInitScript | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend
  labels: {app.kubernetes.io/part-of: myscoutee-msc121}
data:
  nginx.conf: |
    {{- .Files.Get "files/gateway.conf" | replace "@CLUSTER_DNS@" .Values.clusterDns | replace "@NAMESPACE@" .Release.Namespace | replace "@METRICS_UPSTREAMS@" .Values.shared.metricsUpstreamRoutes | nindent 4 }}
  response-policy.conf: |
    {{- .Values.shared.responsePolicy | nindent 4 }}
  runtime-status.conf: |
    {{- .Values.shared.runtimeStatusLocation | replace "/etc/nginx/conf.d/https-response-policy.conf" "/etc/myscoutee/response-policy.conf" | nindent 4 }}
