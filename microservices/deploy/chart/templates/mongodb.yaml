{{- $members := list "mongodb" }}
{{- if $.Values.mongodb.replicaSet }}{{ $members = append $members "mongodb-secondary" }}{{ end }}
{{- range $name := $members }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: myscoutee-msc121
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/managed-by: Helm
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: {{ $.Values.mongodb.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: myscoutee-msc121
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: myscoutee-msc121
        app.kubernetes.io/name: {{ $name }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      {{- if $.Values.mongodb.replicaSet }}
      initContainers:
      - name: replica-key
        image: {{ $.Values.images.mongodb.reference | quote }}
        imagePullPolicy: {{ $.Values.imagePullPolicy }}
        command: [/bin/sh, -ec]
        args:
        - |
          cp /secret/keyfile /key/keyfile
          chown 999:999 /key/keyfile
          chmod 0400 /key/keyfile
          # Mongo validates its stored member address before listening. Resolve
          # our headless member name to this pod before that validation begins.
          timeout 60 sh -ec 'until getent ahostsv4 "$MEMBER_HOST" | awk "{print \$1}" | grep -Fxq "$POD_IP"; do sleep 1; done'
        env:
        - name: MEMBER_HOST
          value: {{ printf "%s.%s.svc.cluster.local" $name $.Release.Namespace | quote }}
        - name: POD_IP
          valueFrom:
            fieldRef: {fieldPath: status.podIP}
        resources:
          requests: {cpu: 10m, memory: 8Mi}
          limits: {cpu: 100m, memory: 32Mi}
        volumeMounts:
        - {name: replica-secret, mountPath: /secret, readOnly: true}
        - {name: replica-key, mountPath: /key}
      {{- end }}
      containers:
      - name: {{ $name }}
        image: {{ $.Values.images.mongodb.reference | quote }}
        imagePullPolicy: {{ $.Values.imagePullPolicy }}
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: {{ $.Values.mongodb.cpuLimit | quote }}
            memory: {{ $.Values.mongodb.memoryMiB }}Mi
        securityContext:
          allowPrivilegeEscalation: false
          {{- if eq $name "mongodb-secondary" }}
          runAsUser: 999
          runAsGroup: 999
          runAsNonRoot: true
          {{- end }}
        {{- if and $.Values.mongodb.replicaSet (eq $name "mongodb-secondary") }}
        command: [mongod]
        {{- end }}
        args:
        - --bind_ip_all
        - --wiredTigerCacheSizeGB
        - '0.25'
        {{- if $.Values.mongodb.replicaSet }}
        - --replSet
        - msc121
        - --keyFile
        - /key/keyfile
        - --oplogSize
        - '256'
        {{- end }}
        envFrom:
        - secretRef:
            name: mongodb-bootstrap
        volumeMounts:
        {{- if $.Values.mongodb.replicaSet }}
        - {name: replica-key, mountPath: /key, readOnly: true}
        {{- end }}
        - name: data
          mountPath: /data/db
        - name: init
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        readinessProbe:
          tcpSocket:
            port: 27017
          periodSeconds: 5
      volumes:
      {{- if $.Values.mongodb.replicaSet }}
      - name: replica-secret
        secret: {secretName: mongodb-replica-key, defaultMode: 256}
      - name: replica-key
        emptyDir: {}
      {{- end }}
      - name: data
        persistentVolumeClaim:
          claimName: {{ $name }}
      - name: init
        configMap:
          name: mongodb-init
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: myscoutee-msc121
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  type: ClusterIP
  {{- if $.Values.mongodb.replicaSet }}
  clusterIP: None
  publishNotReadyAddresses: true
  {{- end }}
  ports:
  - name: service
    port: 27017
    targetPort: 27017

{{- end }}
